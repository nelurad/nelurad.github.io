<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teaching · Nelu D. Radpour</title>
  <link rel="icon" type="image/png" href="sun-icon-36037.png" />
  <link rel="stylesheet" href="style.css" />
  
  <style>
    /* ---- teaching page ---- */
    .page.teaching { margin-top: 70px; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .teaching > h1 { text-align: left; margin-bottom: 1.2rem; }
    .page.teaching p { text-align: left; }
    .teaching .lede { margin-bottom: 4rem; }

    .stats { display: flex; gap: 4rem; margin: 0 0 4.5rem; flex-wrap: wrap; }
    .stat .num { display: block; font-size: 3.2rem; font-weight: 300; color: var(--heading); letter-spacing: -0.5px; line-height: 1.1; }
    .stat .label { font-size: 1.25rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; }

    .section-label {
      font-size: 1.2rem; font-weight: 400; text-transform: uppercase; letter-spacing: 2px;
      color: var(--accent); margin: 0 0 1.8rem; padding-bottom: .8rem; border-bottom: 1px solid var(--line);
    }
    .section { margin-bottom: 4.5rem; }

    .course { margin-bottom: 2.6rem; }
    .course-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1.6rem; }
    .course-title { font-size: 1.8rem; font-weight: 400; color: var(--heading); margin: 0; }
    .course-years { font-size: 1.3rem; color: var(--muted); white-space: nowrap; font-weight: 300; }
    .course-place { font-size: 1.4rem; color: var(--muted); font-weight: 300; margin: .3rem 0 1rem; }

    .terms { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .8rem; }
    .terms li {
      font-size: 1.25rem; line-height: 1; font-weight: 400; color: var(--heading);
      border: 1px solid var(--line); border-radius: 999px; padding: .7rem 1.2rem;
    }
    .terms li b { font-weight: 400; color: var(--heading); }

    @media (max-width: 480px) {
      .course-head { flex-direction: column; gap: .2rem; }
      .stats { gap: 2.4rem; }
    }
    /* ---- line sketch at the top ---- */
    .sketch { display: block; width: 100%; max-width: 175px; height: auto; margin: 0 0 2.4rem -6px; overflow: visible; }
    .sketch .ink { fill: none; stroke: var(--heading); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .sketch .ink.thin { stroke-width: 1.6; }
    .sketch .ink.fold { stroke-width: 1.7; }
    .sketch.ready .ink { visibility: hidden; }
    .sketch.ready .ink.go { visibility: visible; }
      
    /* ---- neuro course: cloud teaser + simulations ---- */
    .neuro-course { position: relative; isolation: isolate; border-radius: 16px; padding: 14px 18px 16px; margin-left: -18px; margin-right: -18px; }
    .neuro-course::before, .neuro-course::after {
      content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background: linear-gradient(90deg, #ff6b6b, #ffb347, #ffe066, #7bd389, #5ec8f2, #9b8cff, #f78fd1, #ff6b6b);
      background-size: 300% 100%; animation: nc-slide 5s linear infinite; opacity: 0; transition: opacity .4s ease;
    }
    .neuro-course::before { padding: 2px; -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
    .neuro-course::after { z-index: -1; filter: blur(18px); }
    .neuro-course.open::before { opacity: 1; }
    .neuro-course.open::after { opacity: .14; }
    @keyframes nc-slide { to { background-position: 300% 0; } }

    /* the little glowing cloud that's always visible */
    .nc-teaser {
      position: relative; display: inline-block; margin: 2.4rem 0 0 4px; padding: 10px 20px;
      font: inherit; font-size: 1.3rem; color: var(--heading); background: #fff; border: 0; border-radius: 999px; cursor: pointer;
      filter: drop-shadow(0 0 7px #ff9a8a) drop-shadow(0 2px 3px rgba(0,0,0,.08));
      animation: nc-glow 6s linear infinite, nc-bob 3.5s ease-in-out infinite;
    }
    .nc-teaser::before, .nc-teaser::after { content: ""; position: absolute; z-index: -1; background: #fff; border-radius: 50%; }
    .nc-teaser::before { width: 28px; height: 28px; top: -12px; left: 14px; }
    .nc-teaser::after { width: 20px; height: 20px; top: -7px; left: 36px; }
    .nc-teaser:hover { text-decoration: underline; }
    .nc-teaser:focus-visible { outline: 2px solid var(--heading); outline-offset: 4px; }
    .nc-teaser .nc-arrow { display: inline-block; margin-left: 6px; transition: transform .3s ease; }
    .neuro-course.open .nc-teaser .nc-arrow { transform: rotate(180deg); }
    @keyframes nc-glow { to { filter: drop-shadow(0 0 7px #ff9a8a) drop-shadow(0 2px 3px rgba(0,0,0,.08)) hue-rotate(360deg); } }
    @keyframes nc-bob { 50% { translate: 0 -3px; } }

    .neuro-course { margin-bottom: 2.6rem; }
    .nc-reveal { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s ease; }
    .nc-reveal > div { overflow: hidden; }
    .neuro-course.open .nc-reveal { grid-template-rows: 1fr; }

    .page.teaching .nc-hint {
      margin: 1.8rem 0 .4rem; font-size: 1.45rem; font-weight: 600;
      background: linear-gradient(90deg, #e2553f, #e8961e, #3fae6a, #2f97d6, #7b61ff, #d4529c);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      opacity: 0; transform: translateY(-6px); transition: opacity .4s ease .1s, transform .4s ease .1s;
    }
    .nc-clouds { display: flex; flex-wrap: wrap; gap: 22px 18px; padding: 22px 6px 14px; }
    .nc-cloud {
      --i: 0; position: relative; display: block; background: #fff; border-radius: 999px; padding: 12px 22px;
      text-decoration: none; color: var(--heading); filter: drop-shadow(0 3px 7px rgba(0,0,0,.13));
      opacity: 0; transform: translateY(-14px) scale(.6);
      transition: opacity .45s ease calc(.15s + var(--i) * .12s), transform .55s cubic-bezier(.34,1.56,.64,1) calc(.15s + var(--i) * .12s);
    }
    .nc-cloud::before, .nc-cloud::after { content: ""; position: absolute; z-index: -1; background: #fff; border-radius: 50%; }
    .nc-cloud::before { width: 34px; height: 34px; top: -14px; left: 16px; }
    .nc-cloud::after { width: 24px; height: 24px; top: -9px; left: 42px; }
    .nc-cloud b { display: block; font-size: 1.4rem; font-weight: 600; }
    .nc-cloud span { display: block; font-size: 1.2rem; color: var(--muted); margin-top: 2px; }
    .nc-cloud:hover b { text-decoration: underline; }
    .nc-cloud.soon { color: #999; background: #f6f6f6; filter: none; cursor: default; }
    .nc-cloud.soon::before, .nc-cloud.soon::after { background: #f6f6f6; }
    .neuro-course.open .nc-hint, .neuro-course.open .nc-cloud { opacity: 1; transform: none; }
    .neuro-course.open .nc-cloud:not(.soon) { animation: nc-bob 3.5s ease-in-out calc(.8s + var(--i) * .4s) infinite; }

    /* the dark "See all NeuroSims" button-cloud */
    .nc-cloud.all { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--heading); color: #fff; font-weight: 600; font-size: 1.35rem; padding: 14px 26px; }
    .nc-cloud.all::before, .nc-cloud.all::after { background: var(--heading); }
    .nc-cloud.all .arr { display: inline-block; margin: 0; font-size: 1.5rem; color: #fff; transition: transform .25s ease; }
    .nc-cloud.all:hover .arr { transform: translateX(4px); }

    @media (prefers-reduced-motion: reduce) {
      .neuro-course::before, .neuro-course::after, .nc-cloud, .nc-teaser { animation: none !important; }
      .nc-reveal, .nc-hint, .nc-cloud { transition: none; }
    }
  </style>
