<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Garden mouse</title>
<style>
:root{--bg:#f6f3ee;--ink:#2b2a28;--muted:#6f6b64;--accent:#e9b949;--card:#fff;--line:#e2ddd3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:20px;font-weight:600;margin:0}
h2{font-size:17px;font-weight:600;margin:0 0 8px}
h3{font-size:15px;font-weight:600;margin:18px 0 6px}
.chips{display:flex;gap:8px}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.stage{position:relative;border-radius:20px;overflow:hidden;background:#e9e1d2;border:1px solid var(--line);aspect-ratio:1/1;touch-action:none;cursor:none}
canvas#arena{position:absolute;inset:0;width:100%;height:100%;display:block}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(43,42,40,.86);color:#fff;padding:7px 14px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(246,243,238,.95);padding:16px;cursor:default}
.overlay[hidden]{display:none}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;max-width:500px;max-height:100%;overflow:auto}
.panel p{margin:0 0 10px;font-size:15px}
.panel .small{font-size:13px;color:var(--muted)}
.panel label{display:block;font-size:14px;margin:12px 0 4px}
.panel textarea{width:100%;height:64px;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:8px}
.panel .opts{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.panel .opts label{display:flex;gap:6px;align-items:center;margin:0}
.err{color:#a33;font-size:13px;min-height:1.2em;margin-top:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
button{font:inherit;font-size:15px;padding:9px 18px;border-radius:999px;border:1px solid #d4a43a;background:var(--accent);color:#2a1d00;cursor:pointer}
button.secondary{background:#fff;border-color:var(--line);color:var(--ink)}
button:focus-visible{outline:2px solid #2b2a28;outline-offset:2px}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
#research{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
#research[hidden]{display:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0 6px}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .n{font-size:22px;font-weight:600}
.stat .l{font-size:13px;color:var(--muted)}
.bars{display:grid;grid-template-columns:150px 1fr 64px;gap:4px 10px;align-items:center;font-size:13px}
.bar{height:14px;background:#efe9df;border-radius:7px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:#c9a24a;border-radius:7px}
.bar b{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:#6f6b64}
.muted{color:var(--muted)}
#csvOut{width:100%;height:120px;font-family:ui-monospace,Menlo,monospace;font-size:12px;margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:8px}
.msg{font-size:13px;color:var(--muted);margin-top:6px;min-height:1.2em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Garden mouse</h1>
    <div class="chips"><div class="chip" id="trialChip">Practice</div><div class="chip">Snacks <span id="snacks">0</span></div></div>
  </header>
  <div class="stage" id="stage">
    <canvas id="arena" aria-label="Top-down view of a garden with a mouse, sculptures and snacks"></canvas>
    <div class="toast" id="toast" role="status"></div>
    <div class="overlay" id="ov"><div class="panel" id="panel"></div></div>
  </div>
  <p class="note" id="footNote">Move your cursor inside the garden and the mouse follows.</p>

  <section id="research" hidden>
    <h2>Researcher view</h2>
    <p class="note" style="margin-top:0" id="saveStatus"></p>
    <div class="stats" id="stats"></div>
    <div id="featureBars"></div>
    <div class="row">
      <button class="secondary" id="copyJson">Copy full data file (JSON)</button>
      <button class="secondary" id="copyTrials">Copy gardens CSV</button>
      <button class="secondary" id="restart">Run again</button>
    </div>
    <div class="msg" id="copyMsg"></div>
    <textarea id="csvOut" readonly hidden aria-label="Data output"></textarea>
  </section>
</div>

<script>
(() => {
/* ============ STUDY SETTINGS ============ */
const DATAPIPE_ID='W3cZlqh5tGf4';  // DataPipe experiment ID. Empty = nothing is saved (pilot mode).
const COMPLETION_URL='';           // Prolific completion link, e.g. https://app.prolific.com/submissions/complete?cc=XXXXXXX
const PER_TYPE_PER_BLOCK=8;        // gardens of each type (sharp-round, sharp-open, round-open) in each block -> 48 gardens
const N_PRACTICE=3, WANDER_MS=4500, HAWK_RATE=0.75;   // hawk passes in 75% of sharp-round gardens in the hawk block
const VERSION='garden-forage-v3';
/* ======================================== */

const S=600,C=S/2,AR=262;
const OBST_R=40, MOUSE_R=13, SPEED=2.2, NIBBLE_MS=260, TIMEOUT_MS=15000, NEAR=100, COVER_PAD=26;
const START={x:C,y:C+205}, BASE={left:{x:C-122,y:C-55},right:{x:C+122,y:C-55}};
const DIST_DIFFS=[-40,-20,0,0,20,40];          // px: how much closer the LEFT snack is than the right (0 twice so equal trials are common)
const SHARP_LV=[0.75,1], ROUND_LV=[0,0.25], COUNTS=[6,9,12], DEPTHS=['shallow','deep'];
const TYPES=['sharp-round','sharp-open','round-open'];
const FOODS=['cheese','strawberry','blueberries','seeds','cracker','apple'];
const STONES=[['#b9a99a','#8f7f70','#d9cdbf'],['#a3abb8','#7b8494','#c9d0da'],['#b7a6b9','#8c7b8f','#d6cad8'],['#a9b5a2','#7f8c79','#cbd5c5'],['#c2ad94','#97836b','#ddd0be']];

const cv=document.getElementById('arena'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');
const dpr=Math.min(2,window.devicePixelRatio||1);cv.width=S*dpr;cv.height=S*dpr;ctx.scale(dpr,dpr);
const ov=document.getElementById('ov'),panel=document.getElementById('panel'),toastEl=document.getElementById('toast');
const trialChip=document.getElementById('trialChip'),snacksEl=document.getElementById('snacks');
const RESEARCHER=(()=>{try{return location.hash==='#researcher';}catch(e){return false;}})();
const params=(()=>{try{return new URLSearchParams(location.search);}catch(e){return new URLSearchParams();}})();
const PID=params.get('PROLIFIC_PID')||'test-'+Math.random().toString(36).slice(2,8);
const STUDY_ID=params.get('STUDY_ID')||'',SESSION_ID=params.get('SESSION_ID')||Math.random().toString(36).slice(2,10);
if(!DATAPIPE_ID)document.getElementById('footNote').textContent='Pilot preview: no data is saved. Move your cursor inside the garden and the mouse follows.';
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const r3=v=>Math.round(v*1000)/1000;
const balanced=(levels,n)=>shuffle(Array.from({length:n},(_,i)=>levels[i%levels.length]));

/* ---------- sand ---------- */
const bed=(()=>{const c=document.createElement('canvas');c.width=S*dpr;c.height=S*dpr;const b=c.getContext('2d');b.scale(dpr,dpr);
  b.fillStyle='#e9e1d2';b.fillRect(0,0,S,S);b.save();b.beginPath();b.arc(C,C,AR,0,Math.PI*2);b.clip();b.fillStyle='#ead7b0';b.fillRect(0,0,S,S);
  for(let i=0;i<2400;i++){const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*AR;b.fillStyle=['rgba(205,175,125,.35)','rgba(245,230,200,.6)','rgba(180,150,105,.25)'][i%3];b.fillRect(C+r*Math.cos(a),C+r*Math.sin(a),1.6,1.6);}
  b.restore();b.lineWidth=14;b.strokeStyle='rgba(255,255,255,.7)';b.beginPath();b.arc(C,C,AR+7,0,Math.PI*2);b.stroke();
  b.lineWidth=1.5;b.strokeStyle='#d3c6ad';b.beginPath();b.arc(C,C,AR+14,0,Math.PI*2);b.stroke();b.beginPath();b.arc(C,C,AR,0,Math.PI*2);b.stroke();
  b.fillStyle='rgba(120,95,60,.18)';b.beginPath();b.ellipse(START.x,START.y+8,22,12,0,0,Math.PI*2);b.fill();return c;})();

/* ---------- sculptures: control points + sharpness dial (0 curved .. 1 angular), equal area ---------- */
function makeBase(count,depth){
  const ph=Math.random()*Math.PI*2,inner=depth==='deep'?rand(.46,.52):rand(.7,.76),pts=[];
  for(let i=0;i<2*count;i++){const a=ph+i*Math.PI/count+rand(-.05,.05),r=i%2?inner*rand(.96,1.04):rand(.93,1.07);pts.push([r*Math.cos(a),r*Math.sin(a)]);}
  return pts;
}
function corners(pts,s){const n=pts.length,t=.5*(1-s);return pts.map((p,i)=>{const pr=pts[(i-1+n)%n],nx=pts[(i+1)%n];
  return {p,a:[p[0]+(pr[0]-p[0])*t,p[1]+(pr[1]-p[1])*t],b:[p[0]+(nx[0]-p[0])*t,p[1]+(nx[1]-p[1])*t]};});}
function outline(pts,s){const cs=corners(pts,s),out=[];
  cs.forEach((c,i)=>{for(let k=0;k<10;k++){const u=k/10,w0=(1-u)*(1-u),w1=2*(1-u)*u,w2=u*u;out.push([w0*c.a[0]+w1*c.p[0]+w2*c.b[0],w0*c.a[1]+w1*c.p[1]+w2*c.b[1]]);}
    const nxt=cs[(i+1)%cs.length].a;for(let k=0;k<4;k++)out.push([c.b[0]+(nxt[0]-c.b[0])*k/4,c.b[1]+(nxt[1]-c.b[1])*k/4]);});
  return out;}
const polyArea=o=>Math.abs(o.reduce((s,p,i)=>{const q=o[(i+1)%o.length];return s+p[0]*q[1]-q[0]*p[1];},0))/2;
function makeShape(count,depth,sharp,R){
  const base=makeBase(count,depth),unit=outline(base,sharp),k=Math.sqrt(Math.PI*R*R/polyArea(unit));
  const pts=base.map(([x,y])=>[x*k,y*k]),poly=unit.map(([x,y])=>[x*k,y*k]);
  return {count,depth,sharp,pts,poly,maxR:Math.max(...poly.map(([x,y])=>Math.hypot(x,y))),meanR:poly.reduce((s,[x,y])=>s+Math.hypot(x,y),0)/poly.length};
}
function tracePath(c,sh){const cs=corners(sh.pts,sh.sharp);c.beginPath();c.moveTo(cs[0].a[0],cs[0].a[1]);
  cs.forEach((q,i)=>{c.quadraticCurveTo(q.p[0],q.p[1],q.b[0],q.b[1]);const nx=cs[(i+1)%cs.length].a;c.lineTo(nx[0],nx[1]);});c.closePath();}
function drawShape(c,x,y,sh,cols){
  c.save();c.translate(x,y);
  c.save();c.translate(4,6);c.fillStyle='rgba(110,85,50,.22)';tracePath(c,sh);c.fill();c.restore();
  c.fillStyle=cols[0];c.strokeStyle=cols[1];c.lineWidth=2;c.lineJoin=sh.sharp>.5?'miter':'round';tracePath(c,sh);c.fill();c.stroke();
  c.save();c.translate(-3,-4);c.scale(.55,.55);c.fillStyle=cols[2];c.globalAlpha=.5;tracePath(c,sh);c.fill();c.restore();
  c.restore();
}

/* ---------- snacks ---------- */
function drawFood(c,f,x,y,k){
  c.save();c.translate(x,y);c.scale(k||1,k||1);
  c.fillStyle='rgba(110,85,50,.22)';c.beginPath();c.ellipse(2,3,11,8,0,0,6.3);c.fill();
  if(f==='cheese'){c.fillStyle='#f4c542';c.strokeStyle='#b8860b';c.lineWidth=1.2;c.beginPath();c.moveTo(-10,6);c.lineTo(10,-2);c.lineTo(10,8);c.lineTo(-10,10);c.closePath();c.fill();c.stroke();c.fillStyle='#d9a52a';c.beginPath();c.arc(3,5,1.8,0,6.3);c.fill();}
  else if(f==='strawberry'){c.fillStyle='#e0504f';c.beginPath();c.moveTo(0,10);c.bezierCurveTo(-11,4,-9,-7,0,-5);c.bezierCurveTo(9,-7,11,4,0,10);c.fill();
    c.fillStyle='#ffe9a8';for(const [a,b] of [[-3,0],[3,1],[0,4],[-1,-2],[3,-3]]){c.beginPath();c.arc(a,b,.9,0,6.3);c.fill();}c.fillStyle='#5f8552';c.beginPath();c.ellipse(0,-6,5,2.5,0,0,6.3);c.fill();}
  else if(f==='blueberries'){for(const [a,b] of [[-5,2],[5,2],[0,-5],[0,5]]){c.fillStyle='#4a5f9e';c.beginPath();c.arc(a,b,5,0,6.3);c.fill();c.fillStyle='rgba(255,255,255,.3)';c.beginPath();c.arc(a-1.5,b-1.5,1.6,0,6.3);c.fill();}}
  else if(f==='seeds'){for(const [a,b,r] of [[-5,0,.4],[4,-3,-.5],[2,5,1.2],[-2,-6,2]]){c.save();c.translate(a,b);c.rotate(r);c.fillStyle='#4b4038';c.beginPath();c.ellipse(0,0,4.5,2.6,0,0,6.3);c.fill();c.strokeStyle='#d8cdbb';c.lineWidth=.8;c.beginPath();c.moveTo(-3,0);c.lineTo(3,0);c.stroke();c.restore();}}
  else if(f==='cracker'){c.fillStyle='#e2b56b';c.strokeStyle='#b88a3e';c.lineWidth=1.2;c.beginPath();c.arc(0,0,10,0,6.3);c.fill();c.stroke();c.fillStyle='#b88a3e';for(const [a,b] of [[-4,-3],[3,-4],[0,1],[-4,4],[4,4]]){c.beginPath();c.arc(a,b,1,0,6.3);c.fill();}}
  else{c.fillStyle='#f2efe0';c.strokeStyle='#c94b43';c.lineWidth=2.4;c.beginPath();c.arc(0,0,9,Math.PI*.15,Math.PI*1.15);c.closePath();c.fill();c.stroke();c.fillStyle='#5a4030';c.beginPath();c.ellipse(-1,2,1.2,2,0,0,6.3);c.fill();}
  c.restore();
}

/* ---------- gardens ----------
   Types: sharp-round, sharp-open (avoidance of sharp vs nothing), round-open (approach to round vs nothing).
   Snacks are identical within a garden; the only cost is distance (one snack can be up to 40 px closer).
   Block 1 = calm, block 2 = hawk season (shadows pass during the wander phase; sculptures give cover). */
function makeGardens(){
  const list=[];
  for(let i=0;i<N_PRACTICE;i++)list.push(garden(-1-i,'practice','calm',pick(TYPES),Math.random()<.5,0,false));
  let idx=1;
  for(const block of ['calm','hawk']){
    const plan=[];
    for(const type of TYPES){const sideFlip=balanced([true,false],PER_TYPE_PER_BLOCK),dd=balanced(DIST_DIFFS,PER_TYPE_PER_BLOCK);
      const hawks=balanced(Array.from({length:PER_TYPE_PER_BLOCK},(_,i)=>i<Math.round(PER_TYPE_PER_BLOCK*HAWK_RATE)),PER_TYPE_PER_BLOCK);
      for(let i=0;i<PER_TYPE_PER_BLOCK;i++)plan.push([type,sideFlip[i],dd[i],block==='hawk'&&type==='sharp-round'&&hawks[i]]);}
    shuffle(plan).forEach(([type,flip,dd,hawk])=>list.push(garden(idx++,block,block,type,flip,dd,hawk)));
  }
  return list;
}
function sculpture(kind){
  if(kind==='open')return {kind,sharp:null,count:null,depth:null,shape:null};
  const sharp=pick(kind==='sharp'?SHARP_LV:ROUND_LV),count=pick(COUNTS),depth=pick(DEPTHS);
  return {kind,sharp,count,depth,shape:makeShape(count,depth,sharp,OBST_R)};
}
function garden(idx,phase,block,type,flip,distDiff,hawk){
  let [a,b]=type.split('-');if(flip)[a,b]=[b,a];
  const sides={left:sculpture(a),right:sculpture(b)};
  // shift the two sides so the LEFT snack is distDiff px closer to the start (approx.), then measure the real distances
  sides.left.pos={x:BASE.left.x,y:BASE.left.y+distDiff/2};sides.right.pos={x:BASE.right.x,y:BASE.right.y-distDiff/2};
  const maxR=Math.max(...['left','right'].map(k=>sides[k].shape?sides[k].shape.maxR:OBST_R)),off=maxR+20,ang=58*Math.PI/180;
  sides.left.px=sides.left.pos.x+off*Math.cos(ang);sides.left.py=sides.left.pos.y+off*Math.sin(ang);
  sides.right.px=sides.right.pos.x-off*Math.cos(ang);sides.right.py=sides.right.pos.y+off*Math.sin(ang);
  for(const k of ['left','right'])sides[k].dist=Math.hypot(sides[k].px-START.x,sides[k].py-START.y);
  return {idx,phase,block,type,practice:phase==='practice',sides,distDiff,hawk,food:pick(FOODS),offset:off,cols:pick(STONES)};
}

/* ---------- state ---------- */
let state='intro',gardens=[],gi=0,G=null,snacks=0,lastT=performance.now(),tStart=0,lastLog=0,startedAt='';
let samples=[],rows=[],nibble=null,pointer=null,firstMove=null,awareness={},saveResult='not saved',lastData=null,hiddenCount=0;
let wander=null,crumbs=[],hawkEv=null,row=null;
const mouse={x:START.x,y:START.y,h:-Math.PI/2,v:0,step:0};
function showPanel(html,btn,fn){panel.innerHTML=html+(btn?'<div class="row"><button id="go">'+btn+'</button></div>':'');ov.hidden=false;
  if(btn){const b=document.getElementById('go');b.onclick=()=>fn();setTimeout(()=>b.focus(),30);}}
const hidePanel=()=>{ov.hidden=true;};
let tt;function toast(m,ms){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('show'),ms||1200);}
function toLocal(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*S,y:(e.clientY-r.top)/r.height*S};}
stage.addEventListener('pointermove',e=>{pointer=toLocal(e);});
stage.addEventListener('pointerdown',e=>{pointer=toLocal(e);});
stage.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')pointer=null;});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(state==='choose'||state==='wander'))hiddenCount++;});

const centerDist=(sd,x,y)=>Math.hypot(sd.pos.x-x,sd.pos.y-y);
function edgeDist(sd,x,y){if(!sd.shape)return centerDist(sd,x,y);let b=1e9;for(const [px,py] of sd.shape.poly){const d=Math.hypot(sd.pos.x+px-x,sd.pos.y+py-y);if(d<b)b=d;}return b;}
function move(f){
  let tx=mouse.x,ty=mouse.y;if(pointer){tx=pointer.x;ty=pointer.y;}
  const dx=tx-mouse.x,dy=ty-mouse.y,d=Math.hypot(dx,dy),want=d>6?Math.min(SPEED,d*0.07):0;
  mouse.v+=(want-mouse.v)*0.16*f;
  if(d>6){let da=Math.atan2(dy,dx)-mouse.h;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;mouse.h+=da*Math.min(1,0.2*f);}
  let nx=mouse.x+Math.cos(mouse.h)*mouse.v*f,ny=mouse.y+Math.sin(mouse.h)*mouse.v*f;
  const rr=Math.hypot(nx-C,ny-C),lim=AR-MOUSE_R-4;if(rr>lim){nx=C+(nx-C)/rr*lim;ny=C+(ny-C)/rr*lim;}
  for(const k of ['left','right']){const sd=G.sides[k];if(!sd.shape)continue;const m=sd.shape.meanR+MOUSE_R,q=Math.hypot(nx-sd.pos.x,ny-sd.pos.y);if(q<m){nx=sd.pos.x+(nx-sd.pos.x)/q*m;ny=sd.pos.y+(ny-sd.pos.y)/q*m;}}
  mouse.x=nx;mouse.y=ny;mouse.step+=mouse.v*f*0.35;
}
function logSample(now,phase){
  if(now-lastLog<50)return;lastLog=now;const L=G.sides.left,R=G.sides.right;
  samples.push({garden:G.idx,phase,t_ms:Math.round(now-tStart),x:r3((mouse.x-C)/AR),y:r3((mouse.y-C)/AR),speed:+mouse.v.toFixed(2),
    dist_center_L:r3(centerDist(L,mouse.x,mouse.y)/AR),dist_center_R:r3(centerDist(R,mouse.x,mouse.y)/AR),
    dist_edge_L:r3(edgeDist(L,mouse.x,mouse.y)/AR),dist_edge_R:r3(edgeDist(R,mouse.x,mouse.y)/AR),hawk:hawkEv&&hawkEv.active?1:0,pointer:pointer?1:0});
}
function step(f,now){
  move(f);
  if(state==='choose'){
    if(firstMove===null&&Math.hypot(mouse.x-START.x,mouse.y-START.y)>8)firstMove=Math.round(now-tStart);
    let hit=null;for(const k of ['left','right']){const sd=G.sides[k];if(Math.hypot(sd.px-mouse.x,sd.py-mouse.y)<MOUSE_R+12)hit=k;}
    if(hit){if(!nibble||nibble.k!==hit)nibble={k:hit,t0:now};else if(now-nibble.t0>NIBBLE_MS){choose(hit,now);nibble=null;return;}}else nibble=null;
    logSample(now,'choose');
    if(now-tStart>TIMEOUT_MS)choose('none',now);
  } else if(state==='wander'){
    for(const cr of crumbs)if(!cr.eaten&&Math.hypot(cr.x-mouse.x,cr.y-mouse.y)<MOUSE_R+8){cr.eaten=true;wander.crumbs++;}
    if(hawkEv&&!hawkEv.done){
      const t=now-hawkEv.t0;
      if(!hawkEv.active&&t>=0){hawkEv.active=true;hawkEv.onset={x:mouse.x,y:mouse.y};toast('A hawk! Hide next to a sculpture!',1600);}
      if(hawkEv.active&&hawkEv.coverAt==null){const c=coverOf(mouse.x,mouse.y);if(c){hawkEv.coverAt=Math.round(t);hawkEv.firstCover=c;}}
      if(hawkEv.active&&t>=hawkEv.passMs){hawkEv.done=true;hawkEv.active=false;const c=coverOf(mouse.x,mouse.y);hawkEv.coverAtPass=c||'none';
        if(c)toast('Safe!',900);else{toast('Eek! The mouse dropped a snack.',1300);if(!G.practice&&snacks>0){snacks--;snacksEl.textContent=snacks;}}
        wander.until=Math.max(wander.until,now+700);}
    }
    logSample(now,'wander');
    if(now>=wander.until)endWander(now);
  }
}
function coverOf(x,y){for(const k of ['left','right']){const sd=G.sides[k];if(sd.shape&&centerDist(sd,x,y)<sd.shape.meanR+MOUSE_R+COVER_PAD)return sd.kind;}return null;}

function choose(k,now){
  const mine=samples.filter(s=>s.garden===G.idx&&s.phase==='choose');
  let maxDev=null;
  if(k!=='none'&&mine.length){const tgt=G.sides[k],other=G.sides[k==='left'?'right':'left'],ax=tgt.px-START.x,ay=tgt.py-START.y,L=Math.hypot(ax,ay);
    const sgn=Math.sign(ax*(other.py-START.y)-ay*(other.px-START.x))||1;
    maxDev=r3(Math.max(...mine.map(s=>{const x=C+s.x*AR-START.x,y=C+s.y*AR-START.y;return sgn*(ax*y-ay*x)/L/AR;})));}
  const sd=k==='none'?null:G.sides[k];
  if(sd&&!G.practice){snacks++;snacksEl.textContent=snacks;}
  if(sd)toast('Yum!',600);
  row={garden:G.idx,phase:G.phase,block:G.block,type:G.type,food:G.food};
  for(const [p,side] of [['L','left'],['R','right']]){const q=G.sides[side];
    Object.assign(row,{[p+'_kind']:q.kind,[p+'_sharpness']:q.sharp==null?null:r3(q.sharp),[p+'_points']:q.count,[p+'_depth']:q.depth,[p+'_snack_dist']:r3(q.dist/AR),
      [p+'_min_center_dist']:mine.length?Math.min(...mine.map(s=>s['dist_center_'+p])):null,[p+'_min_edge_dist']:mine.length?Math.min(...mine.map(s=>s['dist_edge_'+p])):null});}
  Object.assign(row,{dist_diff_px_target:G.distDiff,dist_diff_L_minus_R:r3((G.sides.left.dist-G.sides.right.dist)/AR),choice:k,chosen_kind:sd?sd.kind:null,
    chosen_closer:sd?(sd.dist<=G.sides[k==='left'?'right':'left'].dist):null,rt_move_ms:firstMove,rt_choice_ms:Math.round(now-tStart),path_max_dev_toward_other:maxDev});
  startWander(now);
}
function startWander(now){
  state='wander';wander={t0:now,until:now+WANDER_MS,crumbs:0};
  crumbs=[];while(crumbs.length<3){const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*(AR-30),x=C+r*Math.cos(a),y=C+r*Math.sin(a);
    if(['left','right'].every(k=>centerDist(G.sides[k],x,y)>OBST_R+30)&&Math.hypot(x-mouse.x,y-mouse.y)>60)crumbs.push({x,y,eaten:false});}
  hawkEv=G.hawk?{t0:now+rand(900,1800),passMs:2400,active:false,done:false,coverAt:null,firstCover:null,dir:Math.random()<.5?1:-1}:null;
}
function endWander(now){
  const w=samples.filter(s=>s.garden===G.idx&&s.phase==='wander'&&!s.hawk),dt=.05;
  const dwell=kind=>+(w.filter(s=>['L','R'].some(p=>G.sides[p==='L'?'left':'right'].kind===kind&&s['dist_center_'+p]*AR<NEAR)).length*dt).toFixed(2);
  Object.assign(row,{wander_dwell_sharp_s:dwell('sharp'),wander_dwell_round_s:dwell('round'),wander_dwell_open_s:dwell('open'),wander_crumbs:wander.crumbs,
    hawk:G.hawk?1:0,hawk_first_cover:hawkEv?hawkEv.firstCover||'none':null,hawk_cover_latency_ms:hawkEv?hawkEv.coverAt:null,hawk_cover_at_pass:hawkEv?hawkEv.coverAtPass:null,
    hawk_onset_dist_sharp:hawkEv&&hawkEv.onset?r3(Math.min(...['left','right'].filter(k=>G.sides[k].kind==='sharp').map(k=>centerDist(G.sides[k],hawkEv.onset.x,hawkEv.onset.y)))/AR):null,
    hawk_onset_dist_round:hawkEv&&hawkEv.onset?r3(Math.min(...['left','right'].filter(k=>G.sides[k].kind==='round').map(k=>centerDist(G.sides[k],hawkEv.onset.x,hawkEv.onset.y)))/AR):null});
  rows.push(row);row=null;hawkEv=null;crumbs=[];state='between';gi++;
  const next=gardens[gi];
  setTimeout(()=>{
    if(G.practice&&next&&!next.practice)showPanel('<h2>You\'ve got it!</h2><p>Now the real gardens. Grab whichever snack you like, then let the mouse wander until the next garden appears.</p>','Start',()=>{hidePanel();startGarden();});
    else if(next&&next.block==='hawk'&&G.block!=='hawk')showPanel('<h2>Hawk season!</h2><p>Hawks sometimes fly over the garden now. When you see a hawk\'s shadow, hide the mouse right next to a sculpture until it passes, or it will drop a snack.</p><p class="small">You have '+snacks+' snacks so far. Take a short break if you like.</p>','Keep going',()=>{hidePanel();startGarden();});
    else if(next)startGarden();else askAwareness();
  },350);
}
function startGarden(){
  G=gardens[gi];nibble=null;firstMove=null;mouse.x=START.x;mouse.y=START.y;mouse.v=0;mouse.h=-Math.PI/2;
  const main=gardens.filter(g=>!g.practice).length;
  trialChip.textContent=G.practice?'Practice '+(gi+1)+' of '+N_PRACTICE:'Garden '+G.idx+' of '+main;
  tStart=lastLog=performance.now();state='choose';
}

/* ---------- start, awareness questions (before debrief), saving, debrief ---------- */
function newRun(){
  gardens=makeGardens();gi=0;snacks=0;snacksEl.textContent='0';samples=[];rows=[];awareness={};saveResult='not saved';hiddenCount=0;lastData=null;
  G=gardens[0];mouse.x=START.x;mouse.y=START.y;document.getElementById('research').hidden=true;trialChip.textContent='Practice';
  const touchOnly=(()=>{try{return matchMedia('(pointer:coarse)').matches&&!matchMedia('(any-pointer:fine)').matches;}catch(e){return false;}})();
  showPanel('<h2>Help a garden mouse forage</h2><p>Each garden has two snacks. Guide the mouse to whichever one you like: move your cursor and the mouse follows, and hold it on a snack for a moment to eat it.</p><p>After each snack, the mouse wanders for a few seconds (there may be crumbs to find), then a new garden appears. About 8 minutes.</p>'+
    (touchOnly?'<p class="small"><b>This study works best on a computer with a mouse or trackpad.</b></p>':'')+
    '<p class="small">Consent placeholder: your IRB-approved consent text goes here, before anything starts.</p>','I agree, start practice',()=>{hidePanel();startedAt=new Date().toISOString();startGarden();});
  state='intro';
}
function askAwareness(){
  state='questions';trialChip.textContent='Almost done';
  showPanel('<h2>A few quick questions</h2><p>There are no right or wrong answers.</p>'+
    '<label for="q1">What do you think this study was about?</label><textarea id="q1"></textarea>'+
    '<label for="q2">Did you notice anything about the sculptures? If so, what?</label><textarea id="q2"></textarea>'+
    '<label>Besides distance, did anything else affect which snack you picked?</label><div class="opts">'+
    ['Yes','No','Not sure'].map(t=>'<label><input type="radio" name="q3" value="'+t+'"> '+t+'</label>').join('')+'</div>'+
    '<label for="q4">If yes, what?</label><textarea id="q4"></textarea>'+
    '<label>When a hawk came, did you prefer hiding next to a certain kind of sculpture?</label><div class="opts">'+
    ['Spiky ones','Smooth ones','No preference','Didn\'t notice'].map(t=>'<label><input type="radio" name="q5" value="'+t+'"> '+t+'</label>').join('')+'</div><div class="err" id="qerr"></div>','Continue',()=>{
      const q1=document.getElementById('q1').value.trim(),q3=(document.querySelector('input[name=q3]:checked')||{}).value,q5=(document.querySelector('input[name=q5]:checked')||{}).value;
      if(!q1||!q3||!q5){document.getElementById('qerr').textContent='Please answer the first question and choose an option for each choice question.';return;}
      awareness={study_guess:q1,noticed:document.getElementById('q2').value.trim(),other_influence:q3,other_influence_what:document.getElementById('q4').value.trim(),hawk_cover_pref:q5};saveAndDebrief();});
}
function buildData(){
  return {version:VERSION,prolific_pid:PID,study_id:STUDY_ID,session_id:SESSION_ID,started_at:startedAt,finished_at:new Date().toISOString(),
    screen:{w:screen.width,h:screen.height,stage_px:Math.round(stage.getBoundingClientRect().width),dpr:window.devicePixelRatio||1},
    user_agent:navigator.userAgent,tab_switches:hiddenCount,snacks,awareness,
    stimuli:gardens.map(g=>({garden:g.idx,phase:g.phase,type:g.type,hawk:g.hawk,food:g.food,colour:g.cols[0],
      sides:Object.fromEntries(['left','right'].map(k=>{const q=g.sides[k];return [k,{kind:q.kind,x:r3((q.pos.x-C)/AR),y:r3((q.pos.y-C)/AR),sharpness:q.sharp,points:q.count,depth:q.depth,
        control_points:q.shape?q.shape.pts.map(([a,b])=>[r3(a/AR),r3(b/AR)]):null,max_r:q.shape?r3(q.shape.maxR/AR):null,snack_x:r3((q.px-C)/AR),snack_y:r3((q.py-C)/AR),snack_dist:r3(q.dist/AR)}];}))})),
    trials:rows,samples};
}
async function saveData(data){
  if(!DATAPIPE_ID)return 'skipped (pilot mode, no DataPipe ID set)';
  for(let attempt=1;attempt<=3;attempt++){
    try{const r=await fetch('https://pipe.jspsych.org/api/data/',{method:'POST',headers:{'Content-Type':'application/json',Accept:'*/*'},
        body:JSON.stringify({experimentID:DATAPIPE_ID,filename:PID+'_'+SESSION_ID+'.json',data:JSON.stringify(data)})});
      if(r.ok)return 'saved';}catch(e){}
    await new Promise(res=>setTimeout(res,1500*attempt));
  }
  return 'failed';
}
async function saveAndDebrief(){
  state='saving';showPanel('<h2>Saving your responses…</h2><p class="small">Please keep this page open.</p>');
  lastData=buildData();saveResult=await saveData(lastData);
  if(saveResult==='failed'){showPanel('<h2>We couldn\'t save your responses</h2><p>Please check your internet connection and try again.</p>','Try again',saveAndDebrief);return;}
  state='done';trialChip.textContent='All done';
  showPanel('<h2>All done. The mouse ate '+snacks+' snacks!</h2><p><b>What this study was really about:</b> the sculptures were either spiky or smooth, and sometimes a snack sat in open sand with no sculpture. Snacks were the same on both sides, and one was sometimes a little closer. We were interested in whether people walk farther to avoid spiky sculptures or to reach smooth ones, where the mouse wandered, and which sculptures people hid behind when a hawk came.</p><p>We did not tell you beforehand because knowing could change how you play. If you have questions or want your data removed, contact the research team.</p>',
    RESEARCHER?'See researcher view':'Finish',RESEARCHER?showResearch:finish);
}
function finish(){
  if(COMPLETION_URL){location.href=COMPLETION_URL;return;}
  showPanel('<h2>Thank you!</h2><p>You have finished the study. You can close this tab.</p>');
}

/* ---------- drawing ---------- */
function drawMouse(c){
  const w=Math.sin(mouse.step)*.12;c.save();c.translate(mouse.x,mouse.y);c.rotate(mouse.h);
  c.strokeStyle='#d9a7b0';c.lineWidth=2.5;c.lineCap='round';c.beginPath();c.moveTo(-MOUSE_R,0);c.bezierCurveTo(-MOUSE_R-12,10*Math.sin(mouse.step*.7),-MOUSE_R-20,-8,-MOUSE_R-28,4*Math.sin(mouse.step));c.stroke();
  c.fillStyle='rgba(110,85,50,.2)';c.beginPath();c.ellipse(2,4,MOUSE_R+3,MOUSE_R*.8,0,0,6.3);c.fill();
  c.fillStyle='#cfc8d2';c.beginPath();c.ellipse(0,0,MOUSE_R+4,MOUSE_R*.78,w,0,6.3);c.fill();c.beginPath();c.ellipse(MOUSE_R+3,0,9,7.5,0,0,6.3);c.fill();
  for(const s of [-1,1]){c.fillStyle='#cfc8d2';c.beginPath();c.arc(MOUSE_R-2,s*9,6.5,0,6.3);c.fill();c.fillStyle='#efc1c9';c.beginPath();c.arc(MOUSE_R-2,s*9,4,0,6.3);c.fill();
    c.fillStyle='#2b2a28';c.beginPath();c.arc(MOUSE_R+6,s*3.6,1.6,0,6.3);c.fill();}
  c.fillStyle='#e58a9a';c.beginPath();c.arc(MOUSE_R+12,0,2.2,0,6.3);c.fill();c.restore();
}
function drawHawk(c,now){
  if(!hawkEv||!hawkEv.active)return;
  const t=(now-hawkEv.t0)/hawkEv.passMs,x=hawkEv.dir>0?-80+t*(S+160):S+80-t*(S+160),y=C-40+Math.sin(t*Math.PI)*60;
  c.save();c.translate(x,y);c.scale(hawkEv.dir,1);c.fillStyle='rgba(40,35,30,.28)';
  c.beginPath();c.moveTo(40,0);c.quadraticCurveTo(10,-6,0,-50);c.quadraticCurveTo(-8,-14,-30,-4);c.lineTo(-44,0);c.lineTo(-30,4);c.quadraticCurveTo(-8,14,0,50);c.quadraticCurveTo(10,6,40,0);c.fill();c.restore();
  for(const k of ['left','right']){const sd=G.sides[k];if(!sd.shape)continue;c.strokeStyle='rgba(255,255,255,.55)';c.setLineDash([5,6]);c.lineWidth=2;
    c.beginPath();c.arc(sd.pos.x,sd.pos.y,sd.shape.meanR+MOUSE_R+COVER_PAD,0,6.3);c.stroke();c.setLineDash([]);}
}
function render(now){
  ctx.drawImage(bed,0,0,S,S);
  if(G&&state!=='intro'){
    for(const k of ['left','right']){const sd=G.sides[k];if(sd.shape)drawShape(ctx,sd.pos.x,sd.pos.y,sd.shape,G.cols);}
    if(state==='choose')['left','right'].forEach((k,i)=>{const sd=G.sides[k];drawFood(ctx,G.food,sd.px,sd.py,1+Math.sin(now/380+i)*.05);});
    if(state==='wander')for(const cr of crumbs)if(!cr.eaten){ctx.fillStyle='#d9b26a';ctx.beginPath();ctx.arc(cr.x,cr.y,3.2,0,6.3);ctx.arc(cr.x+4,cr.y+2,2.4,0,6.3);ctx.fill();}
    if(nibble&&state==='choose'){const sd=G.sides[nibble.k],q=clamp((now-nibble.t0)/NIBBLE_MS,0,1);ctx.strokeStyle='#e9b949';ctx.lineWidth=3.5;ctx.lineCap='round';ctx.beginPath();ctx.arc(sd.px,sd.py,22,-Math.PI/2,-Math.PI/2+q*Math.PI*2);ctx.stroke();}
  }
  drawMouse(ctx);
  if(state==='wander')drawHawk(ctx,now);
  if(pointer&&(state==='choose'||state==='wander')){ctx.strokeStyle='rgba(43,42,40,.35)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(pointer.x,pointer.y,7,0,6.3);ctx.stroke();}
}

/* ---------- researcher view (only with #researcher in the URL) ---------- */
function showResearch(){
  hidePanel();const sec=document.getElementById('research');sec.hidden=false;
  document.getElementById('saveStatus').textContent='Data file: '+saveResult+'. Participants never see this view. One person\'s data is noisy; this is a check that everything is recorded.';
  const main=rows.filter(r=>r.phase!=='practice'&&r.choice!=='none');
  const rate=(type,kind,f)=>{const a=main.filter(r=>r.type===type&&(!f||f(r)));return a.length?[a.filter(r=>r.chosen_kind===kind).length/a.length,a.length]:[null,0];};
  const eq=r=>r.dist_diff_px_target===0;
  const hawkRows=rows.filter(r=>r.hawk===1),cov=k=>hawkRows.filter(r=>r.hawk_first_cover===k).length;
  const sum=k=>main.reduce((p,r)=>p+(r[k]||0),0).toFixed(1);
  document.getElementById('stats').innerHTML=[[main.length,'Gardens with a choice'],[cov('round')+' / '+cov('sharp')+' / '+cov('none'),'Hawk cover: round / spiky / none'],
    [sum('wander_dwell_round_s')+' / '+sum('wander_dwell_sharp_s')+' / '+sum('wander_dwell_open_s')+' s','Wandering near round / spiky / open spot']]
    .map(s=>'<div class="stat"><div class="n">'+s[0]+'</div><div class="l">'+s[1]+'</div></div>').join('');
  const bar=(lab,[p,n])=>'<span>'+lab+'</span><div class="bar"><i style="width:'+(p==null?0:p*100)+'%"></i><b></b></div><span class="muted">'+(p==null?'n/a':Math.round(p*100)+'%')+' <small>('+n+')</small></span>';
  const blocks=[['Choice when snacks were equally far',[['Round over spiky',rate('sharp-round','round',eq)],['Open sand over spiky (avoidance)',rate('sharp-open','open',eq)],['Round over open sand (approach)',rate('round-open','round',eq)]]],
    ['Choice across all distances',[['Round over spiky',rate('sharp-round','round')],['Open sand over spiky',rate('sharp-open','open')],['Round over open sand',rate('round-open','round')]]],
    ['Took the farther snack',[['To avoid spiky (vs round)',(()=>{const a=main.filter(r=>r.type==='sharp-round'&&r.dist_diff_px_target!==0&&r.chosen_closer===false);return [a.length?a.filter(r=>r.chosen_kind==='round').length/a.length:null,a.length];})()],
      ['Calm block: round over spiky',rate('sharp-round','round',r=>r.block==='calm')],['Hawk block: round over spiky',rate('sharp-round','round',r=>r.block==='hawk')]]]];
  document.getElementById('featureBars').innerHTML=blocks.map(([t,items])=>'<h3>'+t+'</h3><div class="bars">'+items.map(([l,v])=>bar(l,v)).join('')+'</div>').join('')+
    '<p class="note">50% (the line) = no preference. "Took the farther snack" shows, of the times someone walked farther, how often the farther snack was by the round sculpture.</p>';
  sec.scrollIntoView({behavior:'smooth'});
}
function toCSV(list){if(!list.length)return '';const k=Object.keys(list[0]);return [k.join(',')].concat(list.map(r=>k.map(c=>JSON.stringify(r[c]??'')).join(','))).join('\n');}
async function copy(txt,label){const msg=document.getElementById('copyMsg'),ta=document.getElementById('csvOut');
  try{await navigator.clipboard.writeText(txt);msg.textContent=label+' copied.';ta.hidden=true;}
  catch(e){ta.hidden=false;ta.value=txt;ta.select();msg.textContent='Copying was blocked, so it is shown below. Select it and copy.';}}
document.getElementById('copyJson').onclick=()=>copy(JSON.stringify(lastData||buildData(),null,1),'Full data file');
document.getElementById('copyTrials').onclick=()=>copy(toCSV(rows),'Gardens CSV');
document.getElementById('restart').onclick=()=>{window.scrollTo({top:0,behavior:'smooth'});newRun();};

function frame(now){const f=Math.min(3,(now-lastT)/16.67);lastT=now;if(state==='choose'||state==='wander'||state==='between')step(f,now);render(now);requestAnimationFrame(frame);}
newRun();requestAnimationFrame(frame);
})();
</script>
