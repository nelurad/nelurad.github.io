<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Garden mouse</title>
<style>
:root{--bg:#f6f3ee;--ink:#2b2a28;--muted:#6f6b64;--accent:#e9b949;--card:#fff;--line:#e2ddd3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:20px;font-weight:600;margin:0}
h2{font-size:17px;font-weight:600;margin:0 0 8px}
.chips{display:flex;gap:8px}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px}
.stage{position:relative;border-radius:20px;overflow:hidden;background:#e9e1d2;border:1px solid var(--line);aspect-ratio:1/1;touch-action:none;cursor:none}
canvas#arena{position:absolute;inset:0;width:100%;height:100%;display:block}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(43,42,40,.86);color:#fff;padding:7px 14px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(246,243,238,.95);padding:16px;cursor:default}
.overlay[hidden]{display:none}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;max-width:500px;max-height:100%;overflow:auto}
.panel p{margin:0 0 10px;font-size:15px}
.panel .small{font-size:13px;color:var(--muted)}
.panel label{display:block;font-size:14px;margin:12px 0 4px}
.panel textarea{width:100%;height:64px;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:8px}
.panel .opts{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.panel .opts label{display:flex;gap:6px;align-items:center;margin:0}
.err{color:#a33;font-size:13px;min-height:1.2em;margin-top:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
button{font:inherit;font-size:15px;padding:9px 18px;border-radius:999px;border:1px solid #d4a43a;background:var(--accent);color:#2a1d00;cursor:pointer}
button.secondary{background:#fff;border-color:var(--line);color:var(--ink)}
button:focus-visible{outline:2px solid #2b2a28;outline-offset:2px}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
#research{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
#research[hidden]{display:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0 16px}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .n{font-size:22px;font-weight:600}
.stat .l{font-size:13px;color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.thumbs figure{margin:0}
.thumbs canvas{width:100%;height:auto;display:block;border-radius:10px;border:1px solid var(--line)}
.thumbs figcaption{font-size:12px;color:var(--muted);text-align:center;margin-top:2px}
table{border-collapse:collapse;width:100%;font-size:13px;margin-top:16px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500}
#csvOut{width:100%;height:120px;font-family:ui-monospace,Menlo,monospace;font-size:12px;margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:8px}
.msg{font-size:13px;color:var(--muted);margin-top:6px;min-height:1.2em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Garden mouse</h1>
    <div class="chips"><div class="chip" id="cageChip">Practice garden</div><div class="chip">Snacks <span id="snacks">0</span></div></div>
  </header>
  <div class="stage" id="stage">
    <canvas id="arena" aria-label="Top-down view of a sandy garden with a mouse, four sculptures and snacks"></canvas>
    <div class="toast" id="toast" role="status"></div>
    <div class="overlay" id="ov"><div class="panel" id="panel"></div></div>
  </div>
  <p class="note" id="footNote">Move your cursor inside the garden and the mouse follows.</p>

  <section id="research" hidden>
    <h2>Researcher view</h2>
    <p class="note" style="margin-top:0" id="saveStatus"></p>
    <div class="stats" id="stats"></div>
    <p class="note">Each garden with the mouse's path. Orange = sharp shape, green = round shape, number = order the snack next to it was eaten. Shapes with the same letter are twins.</p>
    <div class="thumbs" id="thumbs"></div>
    <table id="table"></table>
    <div class="row">
      <button class="secondary" id="copyJson">Copy full data file (JSON)</button>
      <button class="secondary" id="copyTrials">Copy garden summary CSV</button>
      <button class="secondary" id="restart">Run again</button>
    </div>
    <div class="msg" id="copyMsg"></div>
    <textarea id="csvOut" readonly hidden aria-label="Data output"></textarea>
  </section>
</div>

<script>
(() => {
/* ============ STUDY SETTINGS: fill these in before collecting real data ============ */
const DATAPIPE_ID='';            // DataPipe experiment ID (pipe.jspsych.org). Empty = nothing is saved (pilot mode).
const COMPLETION_URL='';         // Prolific completion link, e.g. https://app.prolific.com/submissions/complete?cc=XXXXXXX
const VERSION='garden-abstract-v1';
/* ================================================================================== */

const S=600,C=S/2,AR=262,N_CAGES=8;
const SHAPE_R=34, MOUSE_R=13, SPEED=1.7, NIBBLE_MS=380, NEAR=100;   // NEAR: px from a shape's centre that counts as 'near' (same for both twins)
const SLOT_ANG=[45,135,225,315].map(a=>a*Math.PI/180), SLOT_D=145;
const FOODS=['cheese','strawberry','blueberries','seeds','cracker','apple'];
const FOOD_NAME={cheese:'cheese',strawberry:'a strawberry',blueberries:'blueberries',seeds:'sunflower seeds',cracker:'a cracker',apple:'an apple slice'};
const STONES=[['#b9a99a','#8f7f70','#d9cdbf'],['#a3abb8','#7b8494','#c9d0da'],['#b7a6b9','#8c7b8f','#d6cad8'],['#a9b5a2','#7f8c79','#cbd5c5'],['#c2ad94','#97836b','#ddd0be']];

const cv=document.getElementById('arena'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');
const dpr=Math.min(2,window.devicePixelRatio||1);cv.width=S*dpr;cv.height=S*dpr;ctx.scale(dpr,dpr);
const ov=document.getElementById('ov'),panel=document.getElementById('panel'),toastEl=document.getElementById('toast');
const cageChip=document.getElementById('cageChip'),snacksEl=document.getElementById('snacks');
const RESEARCHER=(()=>{try{return location.hash==='#researcher';}catch(e){return false;}})();
const params=(()=>{try{return new URLSearchParams(location.search);}catch(e){return new URLSearchParams();}})();
const PID=params.get('PROLIFIC_PID')||'test-'+Math.random().toString(36).slice(2,8);
const STUDY_ID=params.get('STUDY_ID')||'',SESSION_ID=params.get('SESSION_ID')||Math.random().toString(36).slice(2,10);
if(!DATAPIPE_ID)document.getElementById('footNote').textContent='Pilot preview: no data is saved. Move your cursor inside the garden and the mouse follows.';
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const r3=v=>Math.round(v*1000)/1000;

/* ---------- sand ---------- */
function makeBed(){
  const bed=document.createElement('canvas');bed.width=S*dpr;bed.height=S*dpr;const b=bed.getContext('2d');b.scale(dpr,dpr);
  b.fillStyle='#e9e1d2';b.fillRect(0,0,S,S);
  b.save();b.beginPath();b.arc(C,C,AR,0,Math.PI*2);b.clip();b.fillStyle='#ead7b0';b.fillRect(0,0,S,S);
  for(let i=0;i<2400;i++){const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*AR;
    b.fillStyle=['rgba(205,175,125,.35)','rgba(245,230,200,.6)','rgba(180,150,105,.25)'][i%3];b.fillRect(C+r*Math.cos(a),C+r*Math.sin(a),1.6,1.6);}
  b.restore();
  b.lineWidth=14;b.strokeStyle='rgba(255,255,255,.7)';b.beginPath();b.arc(C,C,AR+7,0,Math.PI*2);b.stroke();
  b.lineWidth=1.5;b.strokeStyle='#d3c6ad';b.beginPath();b.arc(C,C,AR+14,0,Math.PI*2);b.stroke();b.beginPath();b.arc(C,C,AR,0,Math.PI*2);b.stroke();
  return bed;
}

/* ---------- shape twins: same control points, angular vs curved, equal area ---------- */
function makeBase(){
  const n=7+Math.floor(Math.random()*4),ph=Math.random()*Math.PI*2,pts=[];
  for(let i=0;i<2*n;i++){const a=ph+i*Math.PI/n+rand(-.12,.12),r=i%2===0?rand(.85,1.15):rand(.5,.68);pts.push([r*Math.cos(a),r*Math.sin(a)]);}
  return pts;
}
function outline(pts,kind){ // dense boundary polygon (unit scale)
  if(kind==='sharp')return pts.flatMap((p,i)=>{const q=pts[(i+1)%pts.length],o=[];for(let t=0;t<6;t++)o.push([p[0]+(q[0]-p[0])*t/6,p[1]+(q[1]-p[1])*t/6]);return o;});
  const n=pts.length,out=[];
  for(let i=0;i<n;i++){const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],a=[(p0[0]+p1[0])/2,(p0[1]+p1[1])/2],b=[(p1[0]+p2[0])/2,(p1[1]+p2[1])/2];
    for(let t=0;t<12;t++){const u=t/12,w0=(1-u)*(1-u),w1=2*(1-u)*u,w2=u*u;out.push([w0*a[0]+w1*p1[0]+w2*b[0],w0*a[1]+w1*p1[1]+w2*b[1]]);}}
  return out;
}
const polyArea=o=>Math.abs(o.reduce((s,p,i)=>{const q=o[(i+1)%o.length];return s+p[0]*q[1]-q[0]*p[1];},0))/2;
function makeShape(base,kind,rot){
  const raw=base.map(([x,y])=>[x*Math.cos(rot)-y*Math.sin(rot),x*Math.sin(rot)+y*Math.cos(rot)]);
  const unit=outline(raw,kind),k=Math.sqrt(Math.PI*SHAPE_R*SHAPE_R/polyArea(unit));   // scale to equal area
  const pts=raw.map(([x,y])=>[x*k,y*k]),poly=unit.map(([x,y])=>[x*k,y*k]);
  const maxR=Math.max(...poly.map(([x,y])=>Math.hypot(x,y))),meanR=poly.reduce((s,[x,y])=>s+Math.hypot(x,y),0)/poly.length;
  return {kind,pts,poly,maxR,meanR};
}
function tracePath(c,sh){
  const p=sh.pts,n=p.length;c.beginPath();
  if(sh.kind==='sharp'){c.moveTo(p[0][0],p[0][1]);for(let i=1;i<n;i++)c.lineTo(p[i][0],p[i][1]);c.closePath();return;}
  const m=i=>[(p[i][0]+p[(i+1)%n][0])/2,(p[i][1]+p[(i+1)%n][1])/2];
  const s=m(n-1);c.moveTo(s[0],s[1]);for(let i=0;i<n;i++){const e=m(i);c.quadraticCurveTo(p[i][0],p[i][1],e[0],e[1]);}c.closePath();
}
function drawShape(c,o,cols,flat){
  c.save();c.translate(o.x,o.y);const sh=o.shape;
  if(!flat){c.save();c.translate(5,7);c.fillStyle='rgba(110,85,50,.22)';tracePath(c,sh);c.fill();c.restore();}
  c.fillStyle=flat||cols[0];c.strokeStyle=flat?'rgba(0,0,0,.25)':cols[1];c.lineWidth=2;c.lineJoin=sh.kind==='sharp'?'miter':'round';tracePath(c,sh);c.fill();c.stroke();
  if(!flat){c.save();c.translate(-4,-5);c.scale(.55,.55);c.fillStyle=cols[2];c.globalAlpha=.55;tracePath(c,sh);c.fill();c.restore();}
  c.restore();
}

/* ---------- snacks ---------- */
function drawFood(c,f,x,y,k){
  c.save();c.translate(x,y);c.scale(k||1,k||1);
  c.fillStyle='rgba(110,85,50,.22)';c.beginPath();c.ellipse(2,3,11,8,0,0,6.3);c.fill();
  if(f==='cheese'){c.fillStyle='#f4c542';c.strokeStyle='#b8860b';c.lineWidth=1.2;c.beginPath();c.moveTo(-10,6);c.lineTo(10,-2);c.lineTo(10,8);c.lineTo(-10,10);c.closePath();c.fill();c.stroke();c.fillStyle='#d9a52a';c.beginPath();c.arc(3,5,1.8,0,6.3);c.fill();}
  else if(f==='strawberry'){c.fillStyle='#e0504f';c.beginPath();c.moveTo(0,10);c.bezierCurveTo(-11,4,-9,-7,0,-5);c.bezierCurveTo(9,-7,11,4,0,10);c.fill();
    c.fillStyle='#ffe9a8';for(const [a,b] of [[-3,0],[3,1],[0,4],[-1,-2],[3,-3]]){c.beginPath();c.arc(a,b,.9,0,6.3);c.fill();}c.fillStyle='#5f8552';c.beginPath();c.ellipse(0,-6,5,2.5,0,0,6.3);c.fill();}
  else if(f==='blueberries'){for(const [a,b] of [[-5,2],[5,2],[0,-5],[0,5]]){c.fillStyle='#4a5f9e';c.beginPath();c.arc(a,b,5,0,6.3);c.fill();c.fillStyle='rgba(255,255,255,.3)';c.beginPath();c.arc(a-1.5,b-1.5,1.6,0,6.3);c.fill();}}
  else if(f==='seeds'){for(const [a,b,r] of [[-5,0,.4],[4,-3,-.5],[2,5,1.2],[-2,-6,2]]){c.save();c.translate(a,b);c.rotate(r);c.fillStyle='#4b4038';c.beginPath();c.ellipse(0,0,4.5,2.6,0,0,6.3);c.fill();c.strokeStyle='#d8cdbb';c.lineWidth=.8;c.beginPath();c.moveTo(-3,0);c.lineTo(3,0);c.stroke();c.restore();}}
  else if(f==='cracker'){c.fillStyle='#e2b56b';c.strokeStyle='#b88a3e';c.lineWidth=1.2;c.beginPath();c.arc(0,0,10,0,6.3);c.fill();c.stroke();c.fillStyle='#b88a3e';for(const [a,b] of [[-4,-3],[3,-4],[0,1],[-4,4],[4,4]]){c.beginPath();c.arc(a,b,1,0,6.3);c.fill();}}
  else{c.fillStyle='#f2efe0';c.strokeStyle='#c94b43';c.lineWidth=2.4;c.beginPath();c.arc(0,0,9,Math.PI*.15,Math.PI*1.15);c.closePath();c.fill();c.stroke();c.fillStyle='#5a4030';c.beginPath();c.ellipse(-1,2,1.2,2,0,0,6.3);c.fill();}
  c.restore();
}

/* ---------- gardens: 2 twin pairs, each pair = one sharp + one round from the same base ---------- */
function makeGardens(){
  const layouts=shuffle(Array.from({length:N_CAGES},(_,i)=>i%2?'adjacent':'diagonal'));
  const list=[build(0,true,'practice')];
  for(let i=0;i<N_CAGES;i++)list.push(build(i+1,false,layouts[i]));
  return list;
}
function build(idx,practice,layout){
  let kinds=layout==='adjacent'?['sharp','sharp','round','round']:['sharp','round','sharp','round'];
  if(practice)kinds=shuffle(kinds.slice());
  const rot=Math.floor(Math.random()*4);kinds=kinds.map((_,i)=>kinds[(i+rot)%4]);
  const bases=[makeBase(),makeBase()],twinOf={sharp:shuffle([0,1]),round:shuffle([0,1])},used={sharp:0,round:0};
  const [fa,fb]=shuffle(FOODS.slice()),swap=Math.random()<.5,foodFor={sharp:swap?[fb,fa]:[fa,fb],round:[fa,fb]};
  const objs=kinds.map((k,i)=>{const n=used[k]++,twin=twinOf[k][n];return {slot:i,kind:k,twin,shape:makeShape(bases[twin],k,Math.random()*Math.PI*2),food:foodFor[k][n]};});
  // a snack sits at the same distance from the centre of both twins (just outside the larger one)
  const off=[0,1].map(t=>Math.max(...objs.filter(o=>o.twin===t).map(o=>o.shape.maxR))+16);
  objs.forEach(o=>{const a=SLOT_ANG[o.slot];o.x=C+SLOT_D*Math.cos(a);o.y=C+SLOT_D*Math.sin(a);
    const side=Math.atan2(C-o.y,C-o.x)+(Math.random()<.5?-1:1)*rand(.35,.6);
    o.food={type:o.food,x:o.x+off[o.twin]*Math.cos(side),y:o.y+off[o.twin]*Math.sin(side),eaten:false,order:0,offset:off[o.twin]};});
  return {idx,practice,layout,objs,cols:STONES[Math.floor(Math.random()*STONES.length)],bed:makeBed()};
}

/* ---------- state ---------- */
let state='intro',gardens=[],gi=0,g=null,snacks=0,lastT=performance.now(),tStart=0,lastLog=0,startedAt='';
let samples=[],rows=[],eaten=[],nibble=null,pointer=null,awareness={},saveResult='not saved';
const mouse={x:C,y:C,h:0,v:0,step:0};
function showPanel(html,btn,fn){panel.innerHTML=html+(btn?'<div class="row"><button id="go">'+btn+'</button></div>':'');ov.hidden=false;
  if(btn){const b=document.getElementById('go');b.onclick=()=>fn();setTimeout(()=>b.focus(),30);}}
const hidePanel=()=>{ov.hidden=true;};
let tt;function toast(m,ms){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('show'),ms||1600);}
function toLocal(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*S,y:(e.clientY-r.top)/r.height*S};}
stage.addEventListener('pointermove',e=>{pointer=toLocal(e);});
stage.addEventListener('pointerdown',e=>{pointer=toLocal(e);});
stage.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')pointer=null;});
let hiddenCount=0;document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='forage')hiddenCount++;});

function edgeDist(o,x,y){let b=1e9;for(const [px,py] of o.shape.poly){const d=Math.hypot(o.x+px-x,o.y+py-y);if(d<b)b=d;}return b;}
function nearestObj(x,y){let best=null,bd=1e9;for(const o of g.objs){const d=Math.hypot(o.x-x,o.y-y);if(d<bd){bd=d;best=o;}}return {o:best,dist:bd,edge:edgeDist(best,x,y)};}
function step(f,now){
  let tx=mouse.x,ty=mouse.y;if(pointer){tx=pointer.x;ty=pointer.y;}
  const dx=tx-mouse.x,dy=ty-mouse.y,d=Math.hypot(dx,dy),want=d>6?Math.min(SPEED,d*0.06):0;
  mouse.v+=(want-mouse.v)*0.15*f;
  if(d>6){let da=Math.atan2(dy,dx)-mouse.h;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;mouse.h+=da*Math.min(1,0.18*f);}
  let nx=mouse.x+Math.cos(mouse.h)*mouse.v*f,ny=mouse.y+Math.sin(mouse.h)*mouse.v*f;
  const rr=Math.hypot(nx-C,ny-C),lim=AR-MOUSE_R-4;if(rr>lim){nx=C+(nx-C)/rr*lim;ny=C+(ny-C)/rr*lim;}
  for(const o of g.objs){const q=Math.hypot(nx-o.x,ny-o.y),m=o.shape.meanR+MOUSE_R;if(q<m){nx=o.x+(nx-o.x)/q*m;ny=o.y+(ny-o.y)/q*m;}}
  mouse.x=nx;mouse.y=ny;mouse.step+=mouse.v*f*0.35;
  if(state==='forage'){
    let hit=null;for(const o of g.objs)if(!o.food.eaten&&Math.hypot(o.food.x-mouse.x,o.food.y-mouse.y)<MOUSE_R+12)hit=o;
    if(hit){if(!nibble||nibble.o!==hit)nibble={o:hit,t0:now};else if(now-nibble.t0>NIBBLE_MS){eat(hit,now);nibble=null;}}else nibble=null;
  }
  if(state==='forage'&&now-lastLog>=50){lastLog=now;const n=nearestObj(mouse.x,mouse.y);
    samples.push({garden:g.idx,practice:g.practice?1:0,t_ms:Math.round(now-tStart),x:r3((mouse.x-C)/AR),y:r3((mouse.y-C)/AR),
      speed:+mouse.v.toFixed(2),nearest_kind:n.o.kind,nearest_slot:n.o.slot,nearest_center_dist:r3(n.dist/AR),nearest_edge_dist:r3(n.edge/AR),eating:nibble?1:0,pointer:pointer?1:0});}
}
function eat(o,now){
  o.food.eaten=true;o.food.order=eaten.length+1;eaten.push({kind:o.kind,slot:o.slot,twin:o.twin,food:o.food.type,t_ms:Math.round(now-tStart)});
  if(!g.practice){snacks++;snacksEl.textContent=snacks;}
  toast('Yum, '+FOOD_NAME[o.food.type]+'!',1100);
  if(eaten.length===4)finishGarden(now);
}
function finishGarden(now){
  state='done-garden';
  const mine=samples.filter(s=>s.garden===g.idx&&!s.eating),dt=.05;
  const dwell=k=>+(mine.filter(s=>s.nearest_kind===k&&s.nearest_center_dist*AR<NEAR).length*dt).toFixed(2);
  const md=k=>{if(!mine.length)return null;let t=0;for(const s of mine){const x=C+s.x*AR,y=C+s.y*AR;let b=1e9;for(const o of g.objs)if(o.kind===k)b=Math.min(b,Math.hypot(o.x-x,o.y-y));t+=b/AR;}return r3(t/mine.length);};
  const minD=k=>{let b=1e9;for(const s of mine){const x=C+s.x*AR,y=C+s.y*AR;for(const o of g.objs)if(o.kind===k)b=Math.min(b,edgeDist(o,x,y));}return r3(b/AR);};
  rows.push({garden:g.idx,practice:g.practice?1:0,layout:g.layout,
    first_kind:eaten[0].kind,first_food:eaten[0].food,first_latency_ms:eaten[0].t_ms,eat_order:eaten.map(e=>e.kind[0].toUpperCase()).join(''),
    food_order:eaten.map(e=>e.food).join('|'),dwell_sharp_s:dwell('sharp'),dwell_round_s:dwell('round'),
    mean_center_dist_sharp:md('sharp'),mean_center_dist_round:md('round'),min_edge_dist_sharp:minD('sharp'),min_edge_dist_round:minD('round'),
    duration_s:+((now-tStart)/1000).toFixed(1)});
  gi++;
  setTimeout(()=>{
    if(g.practice)showPanel('<h2>Nice foraging!</h2><p>Now '+N_CAGES+' more gardens. Collect all four snacks in each one, in whatever order you like.</p>','Next garden',()=>{hidePanel();startGarden();});
    else if(gi<gardens.length)startGarden();else askAwareness();
  },1300);
}
function startGarden(){
  g=gardens[gi];eaten=[];nibble=null;pointer=null;mouse.x=C;mouse.y=C;mouse.v=0;mouse.h=Math.random()*Math.PI*2;
  cageChip.textContent=g.practice?'Practice garden':'Garden '+g.idx+' of '+N_CAGES;
  tStart=lastLog=performance.now();state='forage';toast(g.practice?'Move your cursor and the mouse follows':'New garden! Find the snacks',1700);
}

/* ---------- start, awareness questions (before debrief), saving, debrief ---------- */
function newRun(){
  gardens=makeGardens();gi=0;snacks=0;snacksEl.textContent='0';samples=[];rows=[];awareness={};saveResult='not saved';hiddenCount=0;
  g=gardens[0];mouse.x=C;mouse.y=C;document.getElementById('research').hidden=true;cageChip.textContent='Practice garden';
  const touchOnly=(()=>{try{return matchMedia('(pointer:coarse)').matches&&!matchMedia('(any-pointer:fine)').matches;}catch(e){return false;}})();
  showPanel('<h2>Help a hungry garden mouse</h2><p>Our mouse lives in a little sandy garden full of stone sculptures. In each garden, four snacks are tucked in next to the sculptures.</p><p>Move your cursor and the mouse follows. Hold it on a snack for a moment to eat it. Collect all four to move on. About 4 minutes.</p>'+
    (touchOnly?'<p class="small"><b>This study works best on a computer with a mouse or trackpad.</b></p>':'')+
    '<p class="small">Consent placeholder: your IRB-approved consent text goes here, before anything starts.</p>','I agree, let\'s go',()=>{hidePanel();startedAt=new Date().toISOString();startGarden();});
  state='intro';
}
function askAwareness(){
  state='questions';cageChip.textContent='Almost done';
  showPanel('<h2>Two quick questions</h2><p>There are no right or wrong answers.</p>'+
    '<label for="q1">What do you think this study was about?</label><textarea id="q1"></textarea>'+
    '<label for="q2">Did you notice anything about the sculptures? If so, what?</label><textarea id="q2"></textarea>'+
    '<label>Did you try to stay near or away from any kind of sculpture?</label><div class="opts">'+
    ['Yes, near some','Yes, away from some','No','Not sure'].map((t,i)=>'<label><input type="radio" name="q3" value="'+t+'"> '+t+'</label>').join('')+'</div>'+
    '<div class="err" id="qerr"></div>','Continue',()=>{
      const q1=document.getElementById('q1').value.trim(),q2=document.getElementById('q2').value.trim(),q3=(document.querySelector('input[name=q3]:checked')||{}).value;
      if(!q1||!q3){document.getElementById('qerr').textContent='Please answer the first and last question.';return;}
      awareness={study_guess:q1,noticed_sculptures:q2,strategy:q3};saveAndDebrief();});
}
function buildData(){
  return {version:VERSION,prolific_pid:PID,study_id:STUDY_ID,session_id:SESSION_ID,started_at:startedAt,finished_at:new Date().toISOString(),
    screen:{w:screen.width,h:screen.height,stage_px:Math.round(stage.getBoundingClientRect().width),dpr:window.devicePixelRatio||1},
    user_agent:navigator.userAgent,tab_switches:hiddenCount,awareness,
    gardens:gardens.map(gd=>({garden:gd.idx,practice:gd.practice,layout:gd.layout,objects:gd.objs.map(o=>({slot:o.slot,kind:o.kind,twin:o.twin,
      x:r3((o.x-C)/AR),y:r3((o.y-C)/AR),control_points:o.shape.pts.map(([a,b])=>[r3(a/AR),r3(b/AR)]),max_r:r3(o.shape.maxR/AR),
      food:o.food.type,food_x:r3((o.food.x-C)/AR),food_y:r3((o.food.y-C)/AR),eaten_order:o.food.order}))})),
    summary:rows,samples};
}
async function saveData(data){
  if(!DATAPIPE_ID)return 'skipped (pilot mode, no DataPipe ID set)';
  for(let attempt=1;attempt<=3;attempt++){
    try{const r=await fetch('https://pipe.jspsych.org/api/data/',{method:'POST',headers:{'Content-Type':'application/json',Accept:'*/*'},
        body:JSON.stringify({experimentID:DATAPIPE_ID,filename:PID+'_'+SESSION_ID+'.json',data:JSON.stringify(data)})});
      if(r.ok)return 'saved';}catch(e){}
    await new Promise(res=>setTimeout(res,1500*attempt));
  }
  return 'failed';
}
let lastData=null;
async function saveAndDebrief(){
  state='saving';showPanel('<h2>Saving your responses…</h2><p class="small">Please keep this page open.</p>');
  lastData=buildData();saveResult=await saveData(lastData);
  if(saveResult==='failed'){showPanel('<h2>We couldn\'t save your responses</h2><p>Please check your internet connection and try again.</p>','Try again',saveAndDebrief);return;}
  state='done';cageChip.textContent='All done';
  showPanel('<h2>All done. The mouse ate '+snacks+' snacks!</h2><p><b>What this study was really about:</b> each garden had two sharp-cornered and two smooth, rounded sculptures. They came in matched pairs: the same shape drawn once with sharp points and once with curves. The same snacks were placed next to both kinds. We were interested in which snacks you went for first and how close the mouse got to each kind of sculpture.</p><p>We did not tell you beforehand because knowing could change how you play. If you have questions or want your data removed, contact the research team.</p>',
    RESEARCHER?'See researcher view':'Finish',RESEARCHER?showResearch:finish);
}
function finish(){
  if(COMPLETION_URL){location.href=COMPLETION_URL;return;}
  showPanel('<h2>Thank you!</h2><p>You have finished the study. You can close this tab.</p>'+(DATAPIPE_ID?'':'<p class="small">Pilot preview: in the real study, participants are sent back to Prolific here.</p>'));
}

/* ---------- drawing ---------- */
function drawMouse(c){
  const w=Math.sin(mouse.step)*.12;c.save();c.translate(mouse.x,mouse.y);c.rotate(mouse.h);
  c.strokeStyle='#d9a7b0';c.lineWidth=2.5;c.lineCap='round';c.beginPath();c.moveTo(-MOUSE_R,0);c.bezierCurveTo(-MOUSE_R-12,10*Math.sin(mouse.step*.7),-MOUSE_R-20,-8,-MOUSE_R-28,4*Math.sin(mouse.step));c.stroke();
  c.fillStyle='rgba(110,85,50,.2)';c.beginPath();c.ellipse(2,4,MOUSE_R+3,MOUSE_R*.8,0,0,6.3);c.fill();
  c.fillStyle='#cfc8d2';c.beginPath();c.ellipse(0,0,MOUSE_R+4,MOUSE_R*.78,w,0,6.3);c.fill();c.beginPath();c.ellipse(MOUSE_R+3,0,9,7.5,0,0,6.3);c.fill();
  for(const s of [-1,1]){c.fillStyle='#cfc8d2';c.beginPath();c.arc(MOUSE_R-2,s*9,6.5,0,6.3);c.fill();c.fillStyle='#efc1c9';c.beginPath();c.arc(MOUSE_R-2,s*9,4,0,6.3);c.fill();
    c.fillStyle='#2b2a28';c.beginPath();c.arc(MOUSE_R+6,s*3.6,1.6,0,6.3);c.fill();}
  c.fillStyle='#e58a9a';c.beginPath();c.arc(MOUSE_R+12,0,2.2,0,6.3);c.fill();c.restore();
}
function render(now){
  if(!g)return;ctx.drawImage(g.bed,0,0,S,S);
  for(const o of g.objs)drawShape(ctx,o,g.cols);
  for(const o of g.objs)if(!o.food.eaten){const bob=1+Math.sin(now/400+o.slot)*.04;drawFood(ctx,o.food.type,o.food.x,o.food.y,bob);}
  if(nibble&&state==='forage'){const q=clamp((now-nibble.t0)/NIBBLE_MS,0,1);ctx.strokeStyle='#e9b949';ctx.lineWidth=3.5;ctx.lineCap='round';ctx.beginPath();ctx.arc(nibble.o.food.x,nibble.o.food.y,17,-Math.PI/2,-Math.PI/2+q*Math.PI*2);ctx.stroke();}
  drawMouse(ctx);
  if(pointer&&state==='forage'){ctx.strokeStyle='rgba(43,42,40,.35)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(pointer.x,pointer.y,7,0,6.3);ctx.stroke();}
}

/* ---------- researcher view (only with #researcher in the URL) ---------- */
function showResearch(){
  hidePanel();const sec=document.getElementById('research');sec.hidden=false;
  document.getElementById('saveStatus').textContent='Data file: '+saveResult+'. Participants never see this view.';
  const main=rows.filter(r=>!r.practice),cnt=k=>main.filter(r=>r.first_kind===k).length,sum=k=>main.reduce((p,r)=>p+r[k],0).toFixed(1);
  const avg=k=>(main.reduce((p,r)=>p+(r[k]||0),0)/Math.max(1,main.length)).toFixed(3);
  document.getElementById('stats').innerHTML=[[cnt('round')+' / '+main.length,'First snack was by a round shape'],[cnt('sharp')+' / '+main.length,'First snack was by a sharp shape'],
    [sum('dwell_round_s')+' s / '+sum('dwell_sharp_s')+' s','Time near round / sharp'],[avg('mean_center_dist_round')+' / '+avg('mean_center_dist_sharp'),'Avg distance to round / sharp (arena radii)']]
    .map(s=>'<div class="stat"><div class="n">'+s[0]+'</div><div class="l">'+s[1]+'</div></div>').join('');
  const th=document.getElementById('thumbs');th.innerHTML='';
  gardens.filter(gd=>!gd.practice).forEach(gd=>{const fig=document.createElement('figure'),c=document.createElement('canvas'),k=160/S;c.width=160*dpr;c.height=160*dpr;const x=c.getContext('2d');x.scale(dpr*k,dpr*k);
    x.drawImage(gd.bed,0,0,S,S);
    for(const o of gd.objs){drawShape(x,o,null,o.kind==='sharp'?'#e3a466':'#6fbf9f');x.fillStyle='#2b2a28';x.font='600 28px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText((o.food.order||'')+'ABCD'[o.twin],o.x,o.y);}
    x.strokeStyle='rgba(43,42,40,.55)';x.lineWidth=3;x.beginPath();let first=true;
    for(const s of samples){if(s.garden!==gd.idx)continue;const px=C+s.x*AR,py=C+s.y*AR;first?x.moveTo(px,py):x.lineTo(px,py);first=false;}x.stroke();
    fig.appendChild(c);const cap=document.createElement('figcaption');cap.textContent='Garden '+gd.idx+' ('+gd.layout+')';fig.appendChild(cap);th.appendChild(fig);});
  const cols=['garden','layout','first_kind','first_food','eat_order','first_latency_ms','dwell_sharp_s','dwell_round_s','min_edge_dist_sharp','min_edge_dist_round'];
  document.getElementById('table').innerHTML='<tr>'+cols.map(c=>'<th>'+c.replace(/_/g,' ')+'</th>').join('')+'</tr>'+
    rows.map(r=>'<tr>'+cols.map(c=>'<td>'+(r.practice&&c==='garden'?'practice':r[c])+'</td>').join('')+'</tr>').join('');
  sec.scrollIntoView({behavior:'smooth'});
}
function toCSV(list){if(!list.length)return '';const k=Object.keys(list[0]);return [k.join(',')].concat(list.map(r=>k.map(c=>JSON.stringify(r[c]??'')).join(','))).join('\n');}
async function copy(txt,label){const msg=document.getElementById('copyMsg'),ta=document.getElementById('csvOut');
  try{await navigator.clipboard.writeText(txt);msg.textContent=label+' copied.';ta.hidden=true;}
  catch(e){ta.hidden=false;ta.value=txt;ta.select();msg.textContent='Copying was blocked, so it is shown below. Select it and copy.';}}
document.getElementById('copyJson').onclick=()=>copy(JSON.stringify(lastData||buildData(),null,1),'Full data file');
document.getElementById('copyTrials').onclick=()=>copy(toCSV(rows),'Garden summary');
document.getElementById('restart').onclick=()=>{window.scrollTo({top:0,behavior:'smooth'});newRun();};

function frame(now){const f=Math.min(3,(now-lastT)/16.67);lastT=now;if(state==='forage'||state==='done-garden')step(f,now);render(now);requestAnimationFrame(frame);}
newRun();requestAnimationFrame(frame);
})();
</script>
</body>
