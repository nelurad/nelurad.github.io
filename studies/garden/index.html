<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Garden mouse</title>
<style>
:root{--bg:#f6f3ee;--ink:#2b2a28;--muted:#6f6b64;--accent:#e9b949;--card:#fff;--line:#e2ddd3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:20px;font-weight:600;margin:0}
h2{font-size:17px;font-weight:600;margin:0 0 8px}
h3{font-size:15px;font-weight:600;margin:18px 0 6px}
.chips{display:flex;gap:8px}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.stage{position:relative;border-radius:20px;overflow:hidden;background:#e9e1d2;border:1px solid var(--line);aspect-ratio:1/1;touch-action:none;cursor:none}
canvas#arena{position:absolute;inset:0;width:100%;height:100%;display:block}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(43,42,40,.86);color:#fff;padding:7px 14px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(246,243,238,.95);padding:16px;cursor:default}
.overlay[hidden]{display:none}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;max-width:500px;max-height:100%;overflow:auto}
.panel p{margin:0 0 10px;font-size:15px}
.panel .small{font-size:13px;color:var(--muted)}
.panel label{display:block;font-size:14px;margin:12px 0 4px}
.panel textarea{width:100%;height:64px;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:8px}
.panel .opts{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.panel .opts label{display:flex;gap:6px;align-items:center;margin:0}
.err{color:#a33;font-size:13px;min-height:1.2em;margin-top:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
button{font:inherit;font-size:15px;padding:9px 18px;border-radius:999px;border:1px solid #d4a43a;background:var(--accent);color:#2a1d00;cursor:pointer}
button.secondary{background:#fff;border-color:var(--line);color:var(--ink)}
button:focus-visible{outline:2px solid #2b2a28;outline-offset:2px}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
#research{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
#research[hidden]{display:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0 6px}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .n{font-size:22px;font-weight:600}
.stat .l{font-size:13px;color:var(--muted)}
.bars{display:grid;grid-template-columns:120px 1fr 64px;gap:4px 10px;align-items:center;font-size:13px}
.bar{height:14px;background:#efe9df;border-radius:7px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:#c9a24a;border-radius:7px}
.bar b{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:#6f6b64}
.muted{color:var(--muted)}
#csvOut{width:100%;height:120px;font-family:ui-monospace,Menlo,monospace;font-size:12px;margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:8px}
.msg{font-size:13px;color:var(--muted);margin-top:6px;min-height:1.2em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Garden mouse</h1>
    <div class="chips"><div class="chip" id="trialChip">Practice</div><div class="chip">Points <span id="points">0</span></div></div>
  </header>
  <div class="stage" id="stage">
    <canvas id="arena" aria-label="Top-down view of a garden with a mouse, two sculptures and two prizes"></canvas>
    <div class="toast" id="toast" role="status"></div>
    <div class="overlay" id="ov"><div class="panel" id="panel"></div></div>
  </div>
  <p class="note" id="footNote">Move your cursor inside the garden and the mouse follows.</p>

  <section id="research" hidden>
    <h2>Researcher view</h2>
    <p class="note" style="margin-top:0" id="saveStatus"></p>
    <div class="stats" id="stats"></div>
    <p class="note">How often a side was chosen, by its features. 50% (the line) means the feature made no difference. One person's data is noisy; this is a check that everything is recorded.</p>
    <div id="featureBars"></div>
    <div class="row">
      <button class="secondary" id="copyJson">Copy full data file (JSON)</button>
      <button class="secondary" id="copyTrials">Copy trials CSV</button>
      <button class="secondary" id="restart">Run again</button>
    </div>
    <div class="msg" id="copyMsg"></div>
    <textarea id="csvOut" readonly hidden aria-label="Data output"></textarea>
  </section>
</div>

<script>
(() => {
/* ============ STUDY SETTINGS: fill these in before collecting real data ============ */
const DATAPIPE_ID='W3cZlqh5tGf4';            // DataPipe experiment ID (pipe.jspsych.org). Empty = nothing is saved (pilot mode).
const COMPLETION_URL='';         // Prolific completion link, e.g. https://app.prolific.com/submissions/complete?cc=XXXXXXX
const BONUS_CENTS_PER_POINT=0;   // 0 = points only. Set (e.g. 1) only once your IRB and budget allow a performance bonus.
const N_TRIALS=60, N_PRACTICE=3, BREAK_AFTER=30;
const VERSION='garden-choice-v2';
/* ================================================================================== */

const S=600,C=S/2,AR=262;
const OBST_R=40, PRIZE_R=13, MOUSE_R=13, SPEED=2.2, NIBBLE_MS=260, TIMEOUT_MS=15000;
const START={x:C,y:C+205}, POS={left:{x:C-122,y:C-55},right:{x:C+122,y:C-55}};
const SHARP_LEVELS=[0,1/3,2/3,1], COUNTS=[6,9,12], DEPTHS=['shallow','deep'], PRIZE_SHAPES=['round','sharp'];
const STONES=[['#b9a99a','#8f7f70','#d9cdbf'],['#a3abb8','#7b8494','#c9d0da'],['#b7a6b9','#8c7b8f','#d6cad8'],['#a9b5a2','#7f8c79','#cbd5c5'],['#c2ad94','#97836b','#ddd0be']];
const PRIZE_COL=['#7d6bb3','#5b4a94','#b3a6dd'];   // one plain colour for every prize, so value comes only from the number

const cv=document.getElementById('arena'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');
const dpr=Math.min(2,window.devicePixelRatio||1);cv.width=S*dpr;cv.height=S*dpr;ctx.scale(dpr,dpr);
const ov=document.getElementById('ov'),panel=document.getElementById('panel'),toastEl=document.getElementById('toast');
const trialChip=document.getElementById('trialChip'),pointsEl=document.getElementById('points');
const RESEARCHER=(()=>{try{return location.hash==='#researcher';}catch(e){return false;}})();
const params=(()=>{try{return new URLSearchParams(location.search);}catch(e){return new URLSearchParams();}})();
const PID=params.get('PROLIFIC_PID')||'test-'+Math.random().toString(36).slice(2,8);
const STUDY_ID=params.get('STUDY_ID')||'',SESSION_ID=params.get('SESSION_ID')||Math.random().toString(36).slice(2,10);
if(!DATAPIPE_ID)document.getElementById('footNote').textContent='Pilot preview: no data is saved. Move your cursor inside the garden and the mouse follows.';
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const r3=v=>Math.round(v*1000)/1000;
const balanced=(levels,n)=>shuffle(Array.from({length:n},(_,i)=>levels[i%levels.length]));

/* ---------- sand ---------- */
const bed=(()=>{const c=document.createElement('canvas');c.width=S*dpr;c.height=S*dpr;const b=c.getContext('2d');b.scale(dpr,dpr);
  b.fillStyle='#e9e1d2';b.fillRect(0,0,S,S);b.save();b.beginPath();b.arc(C,C,AR,0,Math.PI*2);b.clip();b.fillStyle='#ead7b0';b.fillRect(0,0,S,S);
  for(let i=0;i<2400;i++){const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*AR;b.fillStyle=['rgba(205,175,125,.35)','rgba(245,230,200,.6)','rgba(180,150,105,.25)'][i%3];b.fillRect(C+r*Math.cos(a),C+r*Math.sin(a),1.6,1.6);}
  b.restore();b.lineWidth=14;b.strokeStyle='rgba(255,255,255,.7)';b.beginPath();b.arc(C,C,AR+7,0,Math.PI*2);b.stroke();
  b.lineWidth=1.5;b.strokeStyle='#d3c6ad';b.beginPath();b.arc(C,C,AR+14,0,Math.PI*2);b.stroke();b.beginPath();b.arc(C,C,AR,0,Math.PI*2);b.stroke();
  b.fillStyle='rgba(120,95,60,.18)';b.beginPath();b.ellipse(START.x,START.y+8,22,12,0,0,Math.PI*2);b.fill();return c;})();

/* ---------- shapes: control points + a sharpness dial (0 = fully curved, 1 = fully angular), scaled to equal area ---------- */
function makeBase(count,depth){
  const ph=Math.random()*Math.PI*2,inner=depth==='deep'?rand(.46,.52):depth==='none'?.97:rand(.7,.76),pts=[];
  for(let i=0;i<2*count;i++){const a=ph+i*Math.PI/count+(depth==='none'?0:rand(-.05,.05)),r=depth==='none'?(i%2?inner:1):(i%2?inner*rand(.96,1.04):rand(.93,1.07));pts.push([r*Math.cos(a),r*Math.sin(a)]);}
  return pts;
}
function corners(pts,s){const n=pts.length,t=.5*(1-s);return pts.map((p,i)=>{const pr=pts[(i-1+n)%n],nx=pts[(i+1)%n];
  return {p,a:[p[0]+(pr[0]-p[0])*t,p[1]+(pr[1]-p[1])*t],b:[p[0]+(nx[0]-p[0])*t,p[1]+(nx[1]-p[1])*t]};});}
function outline(pts,s){const cs=corners(pts,s),out=[];
  cs.forEach((c,i)=>{for(let k=0;k<10;k++){const u=k/10,w0=(1-u)*(1-u),w1=2*(1-u)*u,w2=u*u;out.push([w0*c.a[0]+w1*c.p[0]+w2*c.b[0],w0*c.a[1]+w1*c.p[1]+w2*c.b[1]]);}
    const nxt=cs[(i+1)%cs.length].a;for(let k=0;k<4;k++)out.push([c.b[0]+(nxt[0]-c.b[0])*k/4,c.b[1]+(nxt[1]-c.b[1])*k/4]);});
  return out;}
const polyArea=o=>Math.abs(o.reduce((s,p,i)=>{const q=o[(i+1)%o.length];return s+p[0]*q[1]-q[0]*p[1];},0))/2;
function makeShape(count,depth,sharp,R){
  const base=makeBase(count,depth),unit=outline(base,sharp),k=Math.sqrt(Math.PI*R*R/polyArea(unit));
  const pts=base.map(([x,y])=>[x*k,y*k]),poly=unit.map(([x,y])=>[x*k,y*k]);
  return {count,depth,sharp,pts,poly,maxR:Math.max(...poly.map(([x,y])=>Math.hypot(x,y))),meanR:poly.reduce((s,[x,y])=>s+Math.hypot(x,y),0)/poly.length};
}
function tracePath(c,sh){const cs=corners(sh.pts,sh.sharp);c.beginPath();c.moveTo(cs[0].a[0],cs[0].a[1]);
  cs.forEach((q,i)=>{c.quadraticCurveTo(q.p[0],q.p[1],q.b[0],q.b[1]);const nx=cs[(i+1)%cs.length].a;c.lineTo(nx[0],nx[1]);});c.closePath();}
function drawShape(c,x,y,sh,cols,shadow){
  c.save();c.translate(x,y);
  if(shadow){c.save();c.translate(4,6);c.fillStyle='rgba(110,85,50,.22)';tracePath(c,sh);c.fill();c.restore();}
  c.fillStyle=cols[0];c.strokeStyle=cols[1];c.lineWidth=2;c.lineJoin=sh.sharp>.5?'miter':'round';tracePath(c,sh);c.fill();c.stroke();
  if(shadow){c.save();c.translate(-3,-4);c.scale(.55,.55);c.fillStyle=cols[2];c.globalAlpha=.5;tracePath(c,sh);c.fill();c.restore();}
  c.restore();
}

/* ---------- trial list: every feature balanced and shuffled independently for each side ---------- */
function makeTrials(){
  const n=N_TRIALS,f=()=>({sharp:balanced(SHARP_LEVELS,n),count:balanced(COUNTS,n),depth:balanced(DEPTHS,n),prize:balanced(PRIZE_SHAPES,n)});
  const L=f(),R=f();
  const valuePairs=shuffle(Array.from({length:63},(_,i)=>[[1,1],[2,2],[3,3],[1,2],[2,1],[1,3],[3,1],[2,3],[3,2]][i%9])).slice(0,n);
  const list=[];
  for(let i=0;i<N_PRACTICE;i++)list.push(trial(-1-i,true,{sharp:SHARP_LEVELS[i%4],count:9,depth:'shallow',prize:'round',value:1},{sharp:SHARP_LEVELS[(i+2)%4],count:9,depth:'shallow',prize:'round',value:1}));
  for(let i=0;i<n;i++)list.push(trial(i+1,false,{sharp:L.sharp[i],count:L.count[i],depth:L.depth[i],prize:L.prize[i],value:valuePairs[i][0]},
                                                 {sharp:R.sharp[i],count:R.count[i],depth:R.depth[i],prize:R.prize[i],value:valuePairs[i][1]}));
  return list;
}
function trial(idx,practice,l,r){
  const sides={left:{...l},right:{...r}};
  for(const k of ['left','right']){const sd=sides[k];sd.shape=makeShape(sd.count,sd.depth,sd.sharp,OBST_R);sd.prizeShape=sd.prize==='sharp'?makeShape(5,'deep',1,PRIZE_R):makeShape(8,'none',0,PRIZE_R);}   // prizes: sharp = 5-point star, round = circle, equal area
  // prizes sit at the same distance from both sculpture centres, toward the mouse's start, mirrored left/right
  const off=Math.max(sides.left.shape.maxR,sides.right.shape.maxR)+20,ang=58*Math.PI/180;
  sides.left.px=POS.left.x+off*Math.cos(ang);sides.left.py=POS.left.y+off*Math.sin(ang);
  sides.right.px=POS.right.x-off*Math.cos(ang);sides.right.py=POS.right.y+off*Math.sin(ang);
  return {idx,practice,sides,offset:off,cols:STONES[Math.floor(Math.random()*STONES.length)]};
}

/* ---------- state ---------- */
let state='intro',trials=[],ti=0,T=null,points=0,lastT=performance.now(),tStart=0,lastLog=0,startedAt='';
let samples=[],rows=[],nibble=null,pointer=null,firstMove=null,awareness={},saveResult='not saved',lastData=null,hiddenCount=0;
const mouse={x:START.x,y:START.y,h:-Math.PI/2,v:0,step:0};
function showPanel(html,btn,fn){panel.innerHTML=html+(btn?'<div class="row"><button id="go">'+btn+'</button></div>':'');ov.hidden=false;
  if(btn){const b=document.getElementById('go');b.onclick=()=>fn();setTimeout(()=>b.focus(),30);}}
const hidePanel=()=>{ov.hidden=true;};
let tt;function toast(m,ms){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('show'),ms||1200);}
function toLocal(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*S,y:(e.clientY-r.top)/r.height*S};}
stage.addEventListener('pointermove',e=>{pointer=toLocal(e);});
stage.addEventListener('pointerdown',e=>{pointer=toLocal(e);});
stage.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')pointer=null;});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='choose')hiddenCount++;});

function edgeDist(sd,pos,x,y){let b=1e9;for(const [px,py] of sd.shape.poly){const d=Math.hypot(pos.x+px-x,pos.y+py-y);if(d<b)b=d;}return b;}
function step(f,now){
  let tx=mouse.x,ty=mouse.y;if(pointer){tx=pointer.x;ty=pointer.y;}
  const dx=tx-mouse.x,dy=ty-mouse.y,d=Math.hypot(dx,dy),want=d>6?Math.min(SPEED,d*0.07):0;
  mouse.v+=(want-mouse.v)*0.16*f;
  if(d>6){let da=Math.atan2(dy,dx)-mouse.h;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;mouse.h+=da*Math.min(1,0.2*f);}
  let nx=mouse.x+Math.cos(mouse.h)*mouse.v*f,ny=mouse.y+Math.sin(mouse.h)*mouse.v*f;
  const rr=Math.hypot(nx-C,ny-C),lim=AR-MOUSE_R-4;if(rr>lim){nx=C+(nx-C)/rr*lim;ny=C+(ny-C)/rr*lim;}
  for(const k of ['left','right']){const p=POS[k],m=T.sides[k].shape.meanR+MOUSE_R,q=Math.hypot(nx-p.x,ny-p.y);if(q<m){nx=p.x+(nx-p.x)/q*m;ny=p.y+(ny-p.y)/q*m;}}
  mouse.x=nx;mouse.y=ny;mouse.step+=mouse.v*f*0.35;
  if(state!=='choose')return;
  if(firstMove===null&&Math.hypot(mouse.x-START.x,mouse.y-START.y)>8)firstMove=Math.round(now-tStart);
  let hit=null;for(const k of ['left','right']){const sd=T.sides[k];if(Math.hypot(sd.px-mouse.x,sd.py-mouse.y)<MOUSE_R+12)hit=k;}
  if(hit){if(!nibble||nibble.k!==hit)nibble={k:hit,t0:now};else if(now-nibble.t0>NIBBLE_MS){choose(hit,now);nibble=null;return;}}else nibble=null;
  if(now-lastLog>=50){lastLog=now;
    samples.push({trial:T.idx,practice:T.practice?1:0,t_ms:Math.round(now-tStart),x:r3((mouse.x-C)/AR),y:r3((mouse.y-C)/AR),speed:+mouse.v.toFixed(2),
      dist_center_L:r3(Math.hypot(POS.left.x-mouse.x,POS.left.y-mouse.y)/AR),dist_center_R:r3(Math.hypot(POS.right.x-mouse.x,POS.right.y-mouse.y)/AR),
      dist_edge_L:r3(edgeDist(T.sides.left,POS.left,mouse.x,mouse.y)/AR),dist_edge_R:r3(edgeDist(T.sides.right,POS.right,mouse.x,mouse.y)/AR),pointer:pointer?1:0});}
  if(now-tStart>TIMEOUT_MS)choose('none',now);
}
function choose(k,now){
  state='between';
  const mine=samples.filter(s=>s.trial===T.idx);
  // path curvature: how far the path bowed toward the side NOT chosen (mouse-tracking style), in arena radii
  let maxDev=null,meanDev=null;
  if(k!=='none'&&mine.length){const tgt=T.sides[k],other=T.sides[k==='left'?'right':'left'],ax=tgt.px-START.x,ay=tgt.py-START.y,L=Math.hypot(ax,ay);
    const sgn=Math.sign(ax*(other.py-START.y)-ay*(other.px-START.x))||1;
    const devs=mine.map(s=>{const x=C+s.x*AR-START.x,y=C+s.y*AR-START.y;return sgn*(ax*y-ay*x)/L/AR;});
    maxDev=r3(Math.max(...devs));meanDev=r3(devs.reduce((a,b)=>a+b,0)/devs.length);}
  const sd=k==='none'?null:T.sides[k];
  if(sd&&!T.practice){points+=sd.value;pointsEl.textContent=points;}
  if(sd)toast('+'+sd.value+(sd.value===1?' point':' points'),700);
  const row={trial:T.idx,practice:T.practice?1:0};
  for(const [p,side] of [['L','left'],['R','right']]){const q=T.sides[side];
    Object.assign(row,{[p+'_sharpness']:r3(q.sharp),[p+'_points']:q.count,[p+'_depth']:q.depth,[p+'_prize_shape']:q.prize,[p+'_value']:q.value,
      [p+'_min_center_dist']:mine.length?Math.min(...mine.map(s=>s['dist_center_'+p])):null,[p+'_min_edge_dist']:mine.length?Math.min(...mine.map(s=>s['dist_edge_'+p])):null});}
  Object.assign(row,{choice:k,chosen_sharpness:sd?r3(sd.sharp):null,chosen_value:sd?sd.value:null,chosen_prize_shape:sd?sd.prize:null,
    rt_move_ms:firstMove,rt_choice_ms:Math.round(now-tStart),path_max_dev_toward_other:maxDev,path_mean_dev_toward_other:meanDev,prize_offset:r3(T.offset/AR)});
  rows.push(row);
  ti++;
  setTimeout(()=>{
    if(T.practice&&ti===N_PRACTICE)showPanel('<h2>You\'ve got it!</h2><p>Now '+N_TRIALS+' gardens. Each time, pick whichever prize you like. The number on a prize is how many points it\'s worth.</p>','Start',()=>{hidePanel();startTrial();});
    else if(!T.practice&&T.idx===BREAK_AFTER)showPanel('<h2>Halfway there</h2><p>Take a short break if you like. You have '+points+' points so far.</p>','Keep going',()=>{hidePanel();startTrial();});
    else if(ti<trials.length)startTrial();else askAwareness();
  },650);
}
function startTrial(){
  T=trials[ti];nibble=null;firstMove=null;mouse.x=START.x;mouse.y=START.y;mouse.v=0;mouse.h=-Math.PI/2;
  trialChip.textContent=T.practice?'Practice '+(ti+1)+' of '+N_PRACTICE:'Garden '+T.idx+' of '+N_TRIALS;
  tStart=lastLog=performance.now();state='choose';
}

/* ---------- start, awareness questions (before debrief), saving, debrief ---------- */
function newRun(){
  trials=makeTrials();ti=0;points=0;pointsEl.textContent='0';samples=[];rows=[];awareness={};saveResult='not saved';hiddenCount=0;lastData=null;
  T=trials[0];mouse.x=START.x;mouse.y=START.y;document.getElementById('research').hidden=true;trialChip.textContent='Practice';
  const touchOnly=(()=>{try{return matchMedia('(pointer:coarse)').matches&&!matchMedia('(any-pointer:fine)').matches;}catch(e){return false;}})();
  showPanel('<h2>Help a garden mouse collect prizes</h2><p>In each garden there are two prizes, each next to a stone sculpture. Guide the mouse to the one you want: move your cursor and the mouse follows. Hold it on a prize for a moment to grab it.</p><p>Each prize shows how many points it\'s worth. You get one prize per garden, then a new garden appears. About 6 minutes.</p>'+
    (BONUS_CENTS_PER_POINT?'<p>Every point earns you a '+BONUS_CENTS_PER_POINT+'¢ bonus.</p>':'')+
    (touchOnly?'<p class="small"><b>This study works best on a computer with a mouse or trackpad.</b></p>':'')+
    '<p class="small">Consent placeholder: your IRB-approved consent text goes here, before anything starts.</p>','I agree, start practice',()=>{hidePanel();startedAt=new Date().toISOString();startTrial();});
  state='intro';
}
function askAwareness(){
  state='questions';trialChip.textContent='Almost done';
  showPanel('<h2>Two quick questions</h2><p>There are no right or wrong answers.</p>'+
    '<label for="q1">What do you think this study was about?</label><textarea id="q1"></textarea>'+
    '<label for="q2">Did you notice anything about the sculptures or the prizes? If so, what?</label><textarea id="q2"></textarea>'+
    '<label>Besides points, did anything else affect which prize you picked?</label><div class="opts">'+
    ['Yes','No','Not sure'].map(t=>'<label><input type="radio" name="q3" value="'+t+'"> '+t+'</label>').join('')+'</div>'+
    '<label for="q4">If yes, what?</label><textarea id="q4"></textarea><div class="err" id="qerr"></div>','Continue',()=>{
      const q1=document.getElementById('q1').value.trim(),q3=(document.querySelector('input[name=q3]:checked')||{}).value;
      if(!q1||!q3){document.getElementById('qerr').textContent='Please answer the first question and choose an option.';return;}
      awareness={study_guess:q1,noticed:document.getElementById('q2').value.trim(),other_influence:q3,other_influence_what:document.getElementById('q4').value.trim()};saveAndDebrief();});
}
function buildData(){
  return {version:VERSION,prolific_pid:PID,study_id:STUDY_ID,session_id:SESSION_ID,started_at:startedAt,finished_at:new Date().toISOString(),
    screen:{w:screen.width,h:screen.height,stage_px:Math.round(stage.getBoundingClientRect().width),dpr:window.devicePixelRatio||1},
    user_agent:navigator.userAgent,tab_switches:hiddenCount,points,bonus_cents:points*BONUS_CENTS_PER_POINT,awareness,
    stimuli:trials.map(t=>({trial:t.idx,practice:t.practice,colour:t.cols[0],prize_offset:r3(t.offset/AR),
      sides:Object.fromEntries(['left','right'].map(k=>{const q=t.sides[k],pos=POS[k];return [k,{x:r3((pos.x-C)/AR),y:r3((pos.y-C)/AR),sharpness:r3(q.sharp),points:q.count,depth:q.depth,
        control_points:q.shape.pts.map(([a,b])=>[r3(a/AR),r3(b/AR)]),max_r:r3(q.shape.maxR/AR),prize_shape:q.prize,value:q.value,prize_x:r3((q.px-C)/AR),prize_y:r3((q.py-C)/AR)}];}))})),
    trials:rows,samples};
}
async function saveData(data){
  if(!DATAPIPE_ID)return 'skipped (pilot mode, no DataPipe ID set)';
  for(let attempt=1;attempt<=3;attempt++){
    try{const r=await fetch('https://pipe.jspsych.org/api/data/',{method:'POST',headers:{'Content-Type':'application/json',Accept:'*/*'},
        body:JSON.stringify({experimentID:DATAPIPE_ID,filename:PID+'_'+SESSION_ID+'.json',data:JSON.stringify(data)})});
      if(r.ok)return 'saved';}catch(e){}
    await new Promise(res=>setTimeout(res,1500*attempt));
  }
  return 'failed';
}
async function saveAndDebrief(){
  state='saving';showPanel('<h2>Saving your responses…</h2><p class="small">Please keep this page open.</p>');
  lastData=buildData();saveResult=await saveData(lastData);
  if(saveResult==='failed'){showPanel('<h2>We couldn\'t save your responses</h2><p>Please check your internet connection and try again.</p>','Try again',saveAndDebrief);return;}
  state='done';trialChip.textContent='All done';
  showPanel('<h2>All done. You collected '+points+' points!</h2><p><b>What this study was really about:</b> the sculptures varied in how sharp or smooth they were, how many points they had, and how deep those points were. The prizes were also sharp or round. Everything was mixed independently, and both prizes were always the same distance from the mouse. We were interested in whether these shape features, beyond the points, influenced which prize you chose and the path the mouse took.</p><p>We did not tell you beforehand because knowing could change how you play. If you have questions or want your data removed, contact the research team.</p>',
    RESEARCHER?'See researcher view':'Finish',RESEARCHER?showResearch:finish);
}
function finish(){
  if(COMPLETION_URL){location.href=COMPLETION_URL;return;}
  showPanel('<h2>Thank you!</h2><p>You have finished the study. You can close this tab.</p>'+(DATAPIPE_ID?'':'<p class="small">Pilot preview: in the real study, participants are sent back to Prolific here.</p>'));
}

/* ---------- drawing ---------- */
function drawMouse(c){
  const w=Math.sin(mouse.step)*.12;c.save();c.translate(mouse.x,mouse.y);c.rotate(mouse.h);
  c.strokeStyle='#d9a7b0';c.lineWidth=2.5;c.lineCap='round';c.beginPath();c.moveTo(-MOUSE_R,0);c.bezierCurveTo(-MOUSE_R-12,10*Math.sin(mouse.step*.7),-MOUSE_R-20,-8,-MOUSE_R-28,4*Math.sin(mouse.step));c.stroke();
  c.fillStyle='rgba(110,85,50,.2)';c.beginPath();c.ellipse(2,4,MOUSE_R+3,MOUSE_R*.8,0,0,6.3);c.fill();
  c.fillStyle='#cfc8d2';c.beginPath();c.ellipse(0,0,MOUSE_R+4,MOUSE_R*.78,w,0,6.3);c.fill();c.beginPath();c.ellipse(MOUSE_R+3,0,9,7.5,0,0,6.3);c.fill();
  for(const s of [-1,1]){c.fillStyle='#cfc8d2';c.beginPath();c.arc(MOUSE_R-2,s*9,6.5,0,6.3);c.fill();c.fillStyle='#efc1c9';c.beginPath();c.arc(MOUSE_R-2,s*9,4,0,6.3);c.fill();
    c.fillStyle='#2b2a28';c.beginPath();c.arc(MOUSE_R+6,s*3.6,1.6,0,6.3);c.fill();}
  c.fillStyle='#e58a9a';c.beginPath();c.arc(MOUSE_R+12,0,2.2,0,6.3);c.fill();c.restore();
}
function drawPrize(c,sd,now,i){
  const k=1+Math.sin(now/380+i)*.05;c.save();c.translate(sd.px,sd.py);c.scale(k,k);
  drawShape(c,0,0,sd.prizeShape,PRIZE_COL,true);
  c.fillStyle='#fff';c.font='700 14px system-ui,sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(sd.value,0,1);c.restore();
}
function render(now){
  ctx.drawImage(bed,0,0,S,S);
  if(T&&state!=='intro'){
    for(const k of ['left','right'])drawShape(ctx,POS[k].x,POS[k].y,T.sides[k].shape,T.cols,true);
    if(state==='choose')['left','right'].forEach((k,i)=>drawPrize(ctx,T.sides[k],now,i));
    if(nibble&&state==='choose'){const sd=T.sides[nibble.k],q=clamp((now-nibble.t0)/NIBBLE_MS,0,1);ctx.strokeStyle='#e9b949';ctx.lineWidth=3.5;ctx.lineCap='round';ctx.beginPath();ctx.arc(sd.px,sd.py,PRIZE_R+9,-Math.PI/2,-Math.PI/2+q*Math.PI*2);ctx.stroke();}
  }
  drawMouse(ctx);
  if(pointer&&state==='choose'){ctx.strokeStyle='rgba(43,42,40,.35)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(pointer.x,pointer.y,7,0,6.3);ctx.stroke();}
}

/* ---------- researcher view (only with #researcher in the URL) ---------- */
function showResearch(){
  hidePanel();const sec=document.getElementById('research');sec.hidden=false;
  document.getElementById('saveStatus').textContent='Data file: '+saveResult+'. Participants never see this view.';
  const main=rows.filter(r=>!r.practice&&r.choice!=='none');
  const obs=main.flatMap(r=>[['L','left'],['R','right']].map(([p,s])=>({chosen:r.choice===s,sharp:r[p+'_sharpness'],points:r[p+'_points'],depth:r[p+'_depth'],prize:r[p+'_prize_shape'],value:r[p+'_value']})));
  const rate=f=>{const a=obs.filter(f);return a.length?[a.filter(o=>o.chosen).length/a.length,a.length]:[null,0];};
  const eqVal=main.filter(r=>r.L_value===r.R_value&&r.L_sharpness!==r.R_sharpness),lessSharp=eqVal.filter(r=>(r.choice==='left')===(r.L_sharpness<r.R_sharpness)).length;
  const avg=k=>{const a=main.map(r=>r[k]).filter(v=>v!=null);return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):'n/a';};
  document.getElementById('stats').innerHTML=[[main.length+' / '+N_TRIALS,'Gardens with a choice'],[lessSharp+' / '+eqVal.length,'Picked the smoother side when points were equal'],[avg('rt_choice_ms')+' ms','Average time to choose']]
    .map(s=>'<div class="stat"><div class="n">'+s[0]+'</div><div class="l">'+s[1]+'</div></div>').join('');
  const groups=[['Sculpture sharpness',SHARP_LEVELS.map(v=>[Math.round(v*100)+'% sharp',o=>Math.abs(o.sharp-v)<.01])],
    ['Point depth',DEPTHS.map(v=>[v,o=>o.depth===v])],['Number of points',COUNTS.map(v=>[v+' points',o=>o.points===v])],
    ['Prize shape',PRIZE_SHAPES.map(v=>[v+' prize',o=>o.prize===v])],['Prize value',[1,2,3].map(v=>[v+(v===1?' point':' points'),o=>o.value===v])]];
  document.getElementById('featureBars').innerHTML=groups.map(([title,levels])=>'<h3>'+title+'</h3><div class="bars">'+levels.map(([lab,f])=>{const [p,n]=rate(f);
    return '<span>'+lab+'</span><div class="bar"><i style="width:'+(p==null?0:p*100)+'%"></i><b></b></div><span class="muted">'+(p==null?'n/a':Math.round(p*100)+'%')+' <small>('+n+')</small></span>';}).join('')+'</div>').join('');
  sec.scrollIntoView({behavior:'smooth'});
}
function toCSV(list){if(!list.length)return '';const k=Object.keys(list[0]);return [k.join(',')].concat(list.map(r=>k.map(c=>JSON.stringify(r[c]??'')).join(','))).join('\n');}
async function copy(txt,label){const msg=document.getElementById('copyMsg'),ta=document.getElementById('csvOut');
  try{await navigator.clipboard.writeText(txt);msg.textContent=label+' copied.';ta.hidden=true;}
  catch(e){ta.hidden=false;ta.value=txt;ta.select();msg.textContent='Copying was blocked, so it is shown below. Select it and copy.';}}
document.getElementById('copyJson').onclick=()=>copy(JSON.stringify(lastData||buildData(),null,1),'Full data file');
document.getElementById('copyTrials').onclick=()=>copy(toCSV(rows),'Trials CSV');
document.getElementById('restart').onclick=()=>{window.scrollTo({top:0,behavior:'smooth'});newRun();};

function frame(now){const f=Math.min(3,(now-lastT)/16.67);lastT=now;if(state==='choose'||state==='between')step(f,now);render(now);requestAnimationFrame(frame);}
newRun();requestAnimationFrame(frame);
})();
</script>
